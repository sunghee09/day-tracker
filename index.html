<title>Time Is Money</title>
<style>
  :root{
    --bg:#16181D;
    --card:#1E212A;
    --border:#2A2E38;
    --text:#EDEEF2;
    --text-dim:#8B909C;
    --text-faint:#54586A;
    --work:#E8794A;
    --job:#3FBFA8;
    --productive:#E8C24A;
    --sleep:#6C6FF0;
    --other:#3A3F4B;
    --fashion:#E85A9E;
    --junk:#E2574C;
    --essentials:#4EA8E8;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;
    justify-content:center;
    padding:calc(env(safe-area-inset-top,20px) + 20px) 20px calc(env(safe-area-inset-bottom,20px) + 24px);
    min-height:100%;
  }
  .app{ width:100%; max-width:440px; }
  .eyebrow{ font-size:13px; color:var(--text-dim); letter-spacing:0.3px; }
  .title{ font-size:22px; font-weight:700; margin-top:2px; margin-bottom:16px; }
  .header-row{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:22px; }
  .header-row .title{ margin-bottom:0; }
  .menu-wrap{ position:relative; flex:none; }
  .menu-trigger{
    width:36px; height:36px;
    border-radius:10px;
    border:1px solid var(--border);
    background:var(--card);
    color:var(--text-dim);
    font-size:20px;
    line-height:1;
    cursor:pointer;
    -webkit-appearance:none;
    appearance:none;
  }
  .menu-dropdown{
    position:absolute;
    top:44px; right:0;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:6px;
    min-width:180px;
    z-index:500;
    box-shadow:0 8px 24px rgba(0,0,0,0.45);
  }
  .menu-item{
    display:block;
    width:100%;
    text-align:left;
    padding:11px 12px;
    border-radius:8px;
    border:none;
    background:transparent;
    color:var(--text);
    font-family:inherit;
    font-size:14px;
    cursor:pointer;
    -webkit-appearance:none;
    appearance:none;
  }
  .budget-line{
    text-align:left;
    font-size:14px;
    font-family:inherit;
    background:none;
    border:none;
    padding:0;
    margin:0;
    cursor:pointer;
    -webkit-appearance:none;
    appearance:none;
  }
  .mode-tabs{ display:flex; gap:8px; margin-bottom:18px; }
  .mode-tab{
    flex:1;
    padding:12px;
    border-radius:12px;
    border:1px solid var(--border);
    background:var(--card);
    color:var(--text-dim);
    font-family:inherit;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    -webkit-appearance:none;
    appearance:none;
  }
  .mode-tab[data-active="true"]{ background:var(--text); color:var(--bg); border-color:var(--text); }
  .buttons{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px; }
  .btn{
    padding:18px 10px;
    border-radius:14px;
    border:1px solid var(--border);
    background:var(--card);
    color:var(--text);
    font-family:inherit;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    transition:background .15s ease, border-color .15s ease, color .15s ease;
    -webkit-appearance:none;
    appearance:none;
  }
  .btn-pulse{ animation:pulse 2s ease-in-out infinite; }
  .money-btn-wide{ grid-column:1 / -1; }
  .btn-dashed{ border-style:dashed; color:var(--text-dim); background:transparent; margin-bottom:10px; }
  @keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:0.82; } }
  .status-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
    min-height:20px;
  }
  .status{
    font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
    font-size:14px;
    color:var(--text-faint);
  }
  .undo{
    background:none;
    border:none;
    color:var(--text-dim);
    font-size:12px;
    text-decoration:underline;

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
(function(){
  // NOTE ON TIME CATEGORY KEYS: the internal key "work" displays as "App" —
  // it's the original tracked category, kept as-is on purpose so every
  // session already logged under it stays intact. "productive" was added
  // later. "job" (the separate "Work" button) has since been retired; any
  // old data logged under it now folds into Other rather than being lost.
  var COLORS = {
    work: '#E8794A', job: '#3FBFA8', productive: '#E8C24A', sleep: '#6C6FF0', other: '#3A3F4B',
    fashion: '#5DBB6F', junk: '#E2574C', essentials: '#4EA8E8',
    makeup: '#E85A9E', aesthetics: '#B27BE0', food: '#E2574C'
  };
  var LABELS = {
    work: 'App', job: 'Work', productive: 'Productive', sleep: 'Sleep', other: 'Other',
    fashion: 'Fashion', junk: 'Junk Food', essentials: 'Essentials',
    makeup: 'Beauty', aesthetics: 'Aesthetics', food: 'Food'
  };
  // ---- money categories are user-editable, stored as {id,label,color} ----
  // ids never change once created (rename only touches the label), so
  // renaming or deleting a category button can never orphan or lose
  // anything already logged under it.
  var DEFAULT_MONEY_CATEGORIES = [
    { id:'fashion', label:'Fashion', color:'#5DBB6F' },
    { id:'makeup', label:'Beauty', color:'#E85A9E' },
    { id:'aesthetics', label:'Aesthetics', color:'#B27BE0' },
    { id:'food', label:'Food', color:'#E2574C' },
    { id:'essentials', label:'Essentials', color:'#4EA8E8' }
  ];
  var COLOR_PALETTE = ['#5DBB6F','#E85A9E','#B27BE0','#E2574C','#4EA8E8','#E8C24A','#3FBFA8','#E8794A','#8B7BE8','#5AA8A0'];

  function loadMoneyCategories(){
    try{
      var raw = localStorage.getItem('dtk_money_categories');
      if(raw){
        var arr = JSON.parse(raw);
        if(Array.isArray(arr) && arr.length) return arr;
      }
    }catch(e){}
    return DEFAULT_MONEY_CATEGORIES.slice();
  }
  function saveMoneyCategories(arr){
    try{ localStorage.setItem('dtk_money_categories', JSON.stringify(arr)); }catch(e){}
  }
  function slugify(label, existingIds){
    var base = label.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'');
    if(!base) base = 'cat';
    var id = base, n = 2;
    while(existingIds.indexOf(id) !== -1){ id = base + '_' + n; n++; }
    return id;
  }
  function nextColor(existing){
    var used = existing.map(function(c){ return c.color; });
    for(var i=0;i<COLOR_PALETTE.length;i++){
      if(used.indexOf(COLOR_PALETTE[i]) === -1) return COLOR_PALETTE[i];
    }
    return COLOR_PALETTE[existing.length % COLOR_PALETTE.length];
  }
  function syncMoneyCategoryLookups(){
    moneyCategories.forEach(function(c){ COLORS[c.id] = c.color; LABELS[c.id] = c.label; });
  }

  // ---- time categories are now editable the same way, with one
  // difference from money: deleting a time category doesn't preserve it
  // as its own historical line, it folds into Other, since "Other" for
  // time is a structural concept (whatever isn't explicitly tracked out
  // of a 24 hour day), not an optional bucket like it is for money. ----
  var DEFAULT_TIME_CATEGORIES = [
    { id:'work', label:'App', color:'#E8794A' },
    { id:'productive', label:'Productive', color:'#E8C24A' },
    { id:'sleep', label:'Sleep', color:'#6C6FF0' }
  ];
  function loadTimeCategories(){
    try{
      var raw = localStorage.getItem('dtk_time_categories');
      if(raw){
        var arr = JSON.parse(raw);
        if(Array.isArray(arr) && arr.length) return arr;
      }
    }catch(e){}
    return DEFAULT_TIME_CATEGORIES.slice();
  }
  function saveTimeCategories(arr){
    try{ localStorage.setItem('dtk_time_categories', JSON.stringify(arr)); }catch(e){}
  }
  function syncTimeCategoryLookups(){
    timeCategories.forEach(function(c){ COLORS[c.id] = c.color; LABELS[c.id] = c.label; });
  }

  function loadMoneyBudget(){
    try{
      var raw = localStorage.getItem('dtk_money_budget');
      if(raw === null) return 800000; // nothing saved yet, default until she sets her own
      var n = parseFloat(raw);
      return isNaN(n) ? 800000 : n;
    }catch(e){ return 800000; }
  }
  function saveMoneyBudget(n){
    try{ localStorage.setItem('dtk_money_budget', String(n)); }catch(e){}
  }

  function loadActive(){
    try{
      var raw = localStorage.getItem('dtk_active');
      return raw ? JSON.parse(raw) : null;
    }catch(e){ return null; }
  }
  function saveActive(a){
    try{
      if(a) localStorage.setItem('dtk_active', JSON.stringify(a));
      else localStorage.removeItem('dtk_active');
    }catch(e){}
  }
  function loadSessions(){
    try{
      var raw = localStorage.getItem('dtk_sessions');
      var arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr : [];
    }catch(e){ return []; }
  }
  function saveSessions(arr){
    try{ localStorage.setItem('dtk_sessions', JSON.stringify(arr)); }catch(e){}
  }
  function loadExpenses(){
    try{
      var raw = localStorage.getItem('dtk_expenses');
      var arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr : [];
    }catch(e){ return []; }
  }
  function saveExpenses(arr){
    try{ localStorage.setItem('dtk_expenses', JSON.stringify(arr)); }catch(e){}
  }

  var sessions = loadSessions();
  var active = loadActive();

  // The Work (internal key "job") category was removed. If it happened to
  // be actively running when this update loads, close it out as a normal
  // completed session right now, rather than leaving a "running" state
  // with no button left to stop it. The time itself isn't lost, it folds
  // into Other from this point on, same as any other retired category.
  if(active && active.type === 'job'){
    sessions.push({ type: 'job', start: active.start, end: new Date().toISOString() });
    saveSessions(sessions);
    active = null;
    saveActive(null);
  }

  var expenses = loadExpenses();
  var moneyCategories = loadMoneyCategories();
  var timeCategories = loadTimeCategories();
  var moneyBudget = loadMoneyBudget();
  var editingMoney = false;
  var editingTime = false;
  var activeExpenseCategory = null;
  syncMoneyCategoryLookups();
  syncTimeCategoryLookups();
  var mode = 'time';
  var currentView = 'today';
  var viewMonth = null;
  var viewMonthMoney = null;
  var historyDirty = true;

  function startOfToday(){
    var d = new Date();
    d.setHours(0,0,0,0);
    return d.getTime();
  }
  function endOfToday(){ return startOfToday() + 24*3600*1000; }

  function overlapMs(startIso, endIso, boundStart, boundEnd){
    var s = Math.max(new Date(startIso).getTime(), boundStart);
    var e = Math.min(new Date(endIso).getTime(), boundEnd);
    return Math.max(0, e - s);
  }

  function formatHM(ms){
    var totalMin = Math.max(0, Math.round(ms/60000));
    var h = Math.floor(totalMin/60);
    var m = totalMin % 60;
    return h + 'h ' + m + 'm';
  }
  function formatClock(ms){
    var totalSec = Math.max(0, Math.floor(ms/1000));
    var h = Math.floor(totalSec/3600);
    var m = Math.floor((totalSec%3600)/60);
    var s = totalSec % 60;
    function pad(v){ return String(v).padStart(2,'0'); }
    return pad(h) + ':' + pad(m) + ':' + pad(s);
  }
  function formatWon(n){
    return '\u20A9' + Math.round(n).toLocaleString('en-US');
  }
  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  function computeTodayTotals(){
    var boundStart = startOfToday();
    var boundEnd = endOfToday();
    var totals = {};
    timeCategories.forEach(function(c){ totals[c.id] = 0; });
    sessions.forEach(function(s){
      var ms = overlapMs(s.start, s.end, boundStart, boundEnd);
      if(totals[s.type] !== undefined) totals[s.type] += ms;
    });
    if(active){
      var ms2 = overlapMs(active.start, new Date().toISOString(), boundStart, boundEnd);
      if(totals[active.type] !== undefined) totals[active.type] += ms2;
    }
    // a planned block that is running right now counts live, minus anything
    // already tracked by hand over the same minutes
    var nowMs = Date.now();
    plan.forEach(function(b){
      if(b.kind !== 'work' || totals[b.type] === undefined) return;
      var ps = new Date(b.start).getTime(), pe = new Date(b.end).getTime();
      if(ps < nowMs && pe > nowMs){
        freeSegments(ps, nowMs).forEach(function(seg){
          totals[b.type] += Math.max(0, Math.min(seg[1], boundEnd) - Math.max(seg[0], boundStart));
        });
      }
    });
    var DAY_MS = boundEnd - boundStart;
    var used = 0;
    timeCategories.forEach(function(c){ used += totals[c.id]; });
    totals.other = Math.max(0, DAY_MS - used);
    return totals;
  }

  // ---- time history: groups every past session into calendar days,
  // splitting any session that crosses midnight across both days it touches ----
  function dateKeyForTime(ms){
    var d = new Date(ms);
    d.setHours(0,0,0,0);
    var y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
    return y + '-' + m + '-' + day;
  }
  function dayBoundsForKey(key){
    var p = key.split('-').map(Number);
    var start = new Date(p[0], p[1]-1, p[2], 0,0,0,0).getTime();
    return [start, start + 24*3600*1000];
  }
  function formatDateKey(key){
    var p = key.split('-').map(Number);
    var d = new Date(p[0], p[1]-1, p[2]);
    return d.toLocaleDateString(undefined, { month:'short', day:'numeric' });
  }

  function computeHistory(){
    var byDay = {};
    function addChunk(type, s, e){
      var cursor = s, guard = 0;
      while(cursor < e && guard < 60){
        guard++;
        var key = dateKeyForTime(cursor);
        var bounds = dayBoundsForKey(key);
        var chunkEnd = Math.min(e, bounds[1]);
        var dur = chunkEnd - cursor;
        if(!byDay[key]){
          byDay[key] = {};
          timeCategories.forEach(function(c){ byDay[key][c.id] = 0; });
        }
        if(byDay[key][type] !== undefined) byDay[key][type] += dur;
        cursor = chunkEnd;
      }
    }
    sessions.forEach(function(s){
      addChunk(s.type, new Date(s.start).getTime(), new Date(s.end).getTime());
    });
    var todayKeyStr = dateKeyForTime(Date.now());
    return Object.keys(byDay)
      .filter(function(k){ return k !== todayKeyStr; })
      .sort().reverse()
      .map(function(k){
        var d = byDay[k];
        var used = 0;
        timeCategories.forEach(function(c){ used += d[c.id]; });
        var o = Math.max(0, 24*3600*1000 - used);
        var row = { key:k, other:o };
        timeCategories.forEach(function(c){ row[c.id] = d[c.id]; });
        return row;
      });
  }

  function monthKeyOf(dayKey){ return dayKey.slice(0,7); }
  function monthKeyForIso(iso){
    var d = new Date(iso);
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
  }
  function formatMonthKey(mKey){
    var p = mKey.split('-').map(Number);
    return new Date(p[0], p[1]-1, 1).toLocaleDateString(undefined, { month:'long', year:'numeric' });
  }
  function shiftMonth(mKey, delta){
    var p = mKey.split('-').map(Number);
    var d = new Date(p[0], p[1]-1 + delta, 1);
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
  }
  function currentMonthKey(){
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
  }

  // adds N months to a date, clamping the day to the last valid day of the
  // target month instead of overflowing (Jan 31 + 1 month -> Feb 28, never
  // a March date), matching how a real card billing cycle behaves
  function addMonthsClamped(date, monthsToAdd){
    var m = date.getMonth() + monthsToAdd;
    var targetYear = date.getFullYear() + Math.floor(m / 12);
    var targetMonth = ((m % 12) + 12) % 12;
    var daysInTargetMonth = new Date(targetYear, targetMonth + 1, 0).getDate();
    var clampedDay = Math.min(date.getDate(), daysInTargetMonth);
    var result = new Date(date.getTime());
    result.setFullYear(targetYear, targetMonth, clampedDay);
    return result;
  }

  // ---- money: every logged expense grouped into the month it fell in.
  // Order is built from current categories, plus any older category id
  // still found in that month's data (so deleting a button never hides
  // history for months where it was actually used). ----
  function computeMoneyMonth(mKey){
    var rows = [];
    expenses.forEach(function(e){
      if(monthKeyForIso(e.date) === mKey) rows.push(e);
    });
    rows.sort(function(a,b){ return new Date(b.date) - new Date(a.date); });

    var order = moneyCategories.map(function(c){ return c.id; });
    rows.forEach(function(e){
      if(order.indexOf(e.category) === -1){
        order.push(e.category);
        if(!LABELS[e.category]) LABELS[e.category] = e.category;
        if(!COLORS[e.category]) COLORS[e.category] = '#5A5F6B';
      }
    });

    var vals = {};
    order.forEach(function(id){ vals[id] = 0; });
    rows.forEach(function(e){ if(vals[e.category] !== undefined) vals[e.category] += e.amount; });

    return { vals: vals, rows: rows, order: order };
  }

  function polarToCartesian(cx, cy, r, angleDeg){
    var rad = (angleDeg - 90) * Math.PI / 180;
    return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
  }
  function donutPath(cx, cy, rOuter, rInner, startAngle, endAngle){
    if(endAngle - startAngle >= 359.99) endAngle = startAngle + 359.99;
    var so = polarToCartesian(cx, cy, rOuter, endAngle);
    var eo = polarToCartesian(cx, cy, rOuter, startAngle);
    var si = polarToCartesian(cx, cy, rInner, endAngle);
    var ei = polarToCartesian(cx, cy, rInner, startAngle);
    var largeArc = (endAngle - startAngle) <= 180 ? 0 : 1;
    return [
      'M', so.x, so.y,
      'A', rOuter, rOuter, 0, largeArc, 0, eo.x, eo.y,
      'L', ei.x, ei.y,
      'A', rInner, rInner, 0, largeArc, 1, si.x, si.y,
      'Z'
    ].join(' ');
  }

  function buildDonut(vals, order){
    var totalMs = 0;
    order.forEach(function(k){ totalMs += vals[k]; });
    var paths = '';
    var angle = 0;
    var gap = 2;
    order.forEach(function(key){
      var v = vals[key];
      if(v <= 0 || totalMs <= 0) return;
      var sweep = (v / totalMs) * 360;
      var start = angle + gap/2;
      var end = angle + sweep - gap/2;
      if(end > start){
        paths += '<path d="' + donutPath(100,100,85,55,start,end) + '" fill="' + COLORS[key] + '"></path>';
      }
      angle += sweep;
    });
    return paths;
  }

  function buildLegend(vals, order, formatter){
    var fmt = formatter || formatHM;
    return order.map(function(key){
      return '<div class="legend-item">' +
        '<div class="legend-dot-row"><span class="dot" style="background:' + COLORS[key] + '"></span>' +
        '<span class="legend-label">' + LABELS[key] + '</span></div>' +
        '<div class="legend-value">' + fmt(vals[key]) + '</div>' +
        '</div>';
    }).join('');
  }

  // renders one or two lines of text centered in the hollow middle of a
  // donut chart (viewBox is always 0 0 200 200, so center is 100,100)
  function buildDonutCenterText(lines){
    return lines.map(function(l){
      return '<text x="100" y="' + (100 + l.dy) + '" text-anchor="middle" font-family="inherit"' +
        ' font-size="' + l.size + '" font-weight="' + l.weight + '" fill="' + l.color + '">' + l.text + '</text>';
    }).join('');
  }

  function renderHistory(){
    var rows = computeHistory();
    if(rows.length === 0){
      historyBody.innerHTML = '<div class="history-empty">No past days yet. Come back tomorrow.</div>';
      return;
    }

    var monthRows = rows.filter(function(r){ return monthKeyOf(r.key) === viewMonth; });

    var nav = '<div class="month-nav">' +
      '<button class="month-arrow" id="prevMonth">\u2039</button>' +
      '<div class="month-label">' + formatMonthKey(viewMonth) + '</div>' +
      '<button class="month-arrow" id="nextMonth">\u203A</button>' +
      '</div>';

    if(monthRows.length === 0){
      historyBody.innerHTML = nav + '<div class="history-empty">Nothing logged this month.</div>';
      wireMonthNav();
      return;
    }

    var mVals = {};
    timeCategories.forEach(function(c){ mVals[c.id] = 0; });
    monthRows.forEach(function(r){
      timeCategories.forEach(function(c){ mVals[c.id] += r[c.id] || 0; });
    });
    var used = 0;
    timeCategories.forEach(function(c){ used += mVals[c.id]; });
    mVals.other = Math.max(0, monthRows.length * 24*3600*1000 - used);

    // the pie and legend show a per-day AVERAGE across the days actually
    // logged this month, not the raw total, so it reads as "a typical day"
    var dayCount = monthRows.length;
    var avgVals = { other: mVals.other / dayCount };
    timeCategories.forEach(function(c){ avgVals[c.id] = mVals[c.id] / dayCount; });
    var order = timeCategories.map(function(c){ return c.id; }).concat(['other']);

    var chart = '<div class="chart-wrap"><svg viewBox="0 0 200 200" width="200" height="200">' + buildDonut(avgVals, order) + '</svg></div>';
    var legendHtml = '<div class="legend">' + buildLegend(avgVals, order) + '</div>';
    var dayCountLabel = '<div class="month-sub">Daily average across ' + dayCount + (dayCount === 1 ? ' day' : ' days') + ' logged</div>';

    var tableHeaders = '<th>Date</th>' + timeCategories.map(function(c){
      return '<th>' + (c.label.length > 5 ? c.label.slice(0,4) : c.label) + '</th>';
    }).join('');
    var body = monthRows.map(function(r){
      var cells = timeCategories.map(function(c){ return '<td>' + formatHM(r[c.id] || 0) + '</td>'; }).join('');
      return '<tr><td>' + formatDateKey(r.key) + '</td>' + cells + '</tr>';
    }).join('');
    var table = '<table class="history-table"><thead><tr>' + tableHeaders + '</tr></thead><tbody>' + body + '</tbody></table>';

    historyBody.innerHTML = nav + chart + legendHtml + dayCountLabel + table;
    wireMonthNav();
  }

  }

  function renderTimeButtons(){
    var cats = timeCategories;
    var html = cats.map(function(c, idx){
      var isLastOdd = (idx === cats.length - 1) && (cats.length % 2 === 1) && !editingTime;
      var cls = 'btn' + (isLastOdd ? ' money-btn-wide' : '');
      if(editingTime){
        return '<button type="button" class="' + cls + '" data-time-id="' + c.id + '">\u270E ' + c.label + '</button>';
      }
      var isActive = !!(active && active.type === c.id);
      var style = isActive ? ' style="background:' + c.color + '; border-color:' + c.color + '; color:#0F1013;"' : '';
      return '<button type="button" class="' + cls + (isActive ? ' btn-pulse' : '') + '"' + style + ' data-time-id="' + c.id + '">' + (isActive ? '\u25A0 Stop' : '\u25B6 ' + c.label) + '</button>';
    }).join('');
    if(editingTime){
      html += '<button type="button" class="btn money-btn-wide btn-dashed" id="addTimeCategoryBtn" style="margin-bottom:0;">+ Add category</button>';
    }
    timeButtonsEl.innerHTML = html;

    var btns = timeButtonsEl.querySelectorAll('[data-time-id]');
    for(var i = 0; i < btns.length; i++){
      (function(btn){
        btn.addEventListener('click', function(){

          if(editingTime) editTimeCategory(id);
          else toggle(id);
        });

      if(addBtn) addBtn.addEventListener('click', addTimeCategory);

  function editTimeCategory(id){
    var cat = timeCategories.filter(function(c){ return c.id === id; })[0];
    if(!cat) return;
    var input = window.prompt('Rename "' + cat.label + '", or clear the text and confirm to remove this button:', cat.label);
    if(input === null) return;
    var trimmed = input.trim();
    if(trimmed === ''){
      var sure = window.confirm('Remove the "' + cat.label + '" button? Time already logged under it folds into Other going forward, it is not deleted.');
      if(!sure) return;
      if(active && active.type === id){
        closeActive(new Date().toISOString());
        active = null;
        saveActive(null);
      }
      timeCategories = timeCategories.filter(function(c){ return c.id !== id; });
    } else {
      cat.label = trimmed;
      LABELS[id] = trimmed;
    }
    saveTimeCategories(timeCategories);
    historyDirty = true;
    renderTimeButtons();
    render();
  }

  function addTimeCategory(){
    var input = window.prompt('New category name:');
    if(input === null) return;
    var trimmed = input.trim();
    if(!trimmed){ window.alert('Enter a name first.'); return; }
    var existingIds = timeCategories.map(function(c){ return c.id; });
    var id = slugify(trimmed, existingIds);
    var color = nextColor(timeCategories);
    timeCategories.push({ id: id, label: trimmed, color: color });
    COLORS[id] = color;

    saveTimeCategories(timeCategories);
    renderTimeButtons();
    render();

  function render(){

      var elapsed = Date.now() - new Date(active.start).getTime();
      statusLine.style.color = COLORS[active.type] || 'var(--text)';
      if(active.quest){
        statusLine.textContent = active.quest.label + ' \u00B7 ' + formatClock(Math.max(0, active.quest.limitMs - elapsed)) + ' left';
      } else {
        statusLine.textContent = (LABELS[active.type] || active.type) + ' running \u00B7 ' + formatClock(elapsed);
      }
    } else {
      var pb = currentPlanBlock();
      if(pb && pb.kind === 'break'){
        statusLine.style.color = 'var(--text-dim)';
        statusLine.textContent = 'Break until ' + fmtTod(new Date(pb.end).getTime());
      } else if(pb){
        statusLine.style.color = COLORS[pb.type] || 'var(--text)';
        statusLine.textContent = 'Planned: ' + (LABELS[pb.type] || pb.type) + ' until ' + fmtTod(new Date(pb.end).getTime());
      } else {
        statusLine.style.color = 'var(--text-faint)';
        statusLine.textContent = 'Nothing running';

  function saveManualTimeEntry(){
    var dateStr = manualDateInput.value;

    var endStr = manualEndInput.value;
    if(!dateStr || !startStr || !endStr){
      window.alert('Fill in the date and both times.');
      return;
    }
    var start = new Date(dateStr + 'T' + startStr + ':00');
    var end = new Date(dateStr + 'T' + endStr + ':00');
    if(isNaN(start.getTime()) || isNaN(end.getTime())){
      window.alert('Something looks off with those times, try again.');
      return;
    }
    if(end.getTime() <= start.getTime()){
      end = new Date(end.getTime() + 24*3600*1000); // crossed midnight
    }
    sessions.push({ type: manualSelectedCategory, start: start.toISOString(), end: end.toISOString() });

    var total = order.reduce(function(sum,k){ return sum + data.vals[k]; }, 0);

    undoExpenseBtn.style.display = expenses.length ? 'block' : 'none';

    var isCurrentMonth = viewMonthMoney === currentMonthKey();

    if(!isCurrentMonth){
      moneyBudgetLine.textContent = formatWon(total) + ' spent in ' + formatMonthKey(viewMonthMoney);
      moneyBudgetLine.style.color = 'var(--text-dim)';
    } else if(moneyBudget > 0){
      moneyBudgetLine.textContent = formatWon(total) + ' spent out of ' + formatWon(moneyBudget);
      moneyBudgetLine.style.color = total > moneyBudget ? '#E2574C' : 'var(--text-dim)';
    } else {
      moneyBudgetLine.textContent = '+ Set a monthly budget';
      moneyBudgetLine.style.color = 'var(--text-dim)';
    }

    var nav = '<div class="month-nav">' +
      '<button class="month-arrow" id="prevMoneyMonth">\u2039</button>' +
      '<div class="month-label">' + formatMonthKey(viewMonthMoney) + '</div>' +
      '<button class="month-arrow" id="nextMoneyMonth">\u203A</button>' +
      '</div>';

    if(data.rows.length === 0 && (!isCurrentMonth || moneyBudget <= 0)){
      moneyCard.innerHTML = nav + '<div class="history-empty">Nothing logged this month.</div>';
      wireMoneyMonthNav();
      return;
    }

    // the pie shows actual category spending, plus (when a budget is set) a
    // gray "Remaining" slice sized to whatever's left of the budget, so the
    // whole ring represents the budget itself rather than just spending
    var chartVals = Object.assign({}, data.vals);
    var chartOrder = data.order.slice();
    var centerHtml = '';
    var hasCenterTap = false;
    if(isCurrentMonth && moneyBudget > 0){
      var remaining = moneyBudget - total;
      var isOver = remaining < 0;
      chartVals.budgetRemaining = Math.max(0, remaining);
      chartOrder.push('budgetRemaining');
      COLORS.budgetRemaining = '#3A3F4B';
      LABELS.budgetRemaining = 'Remaining';
      centerHtml = '<circle cx="100" cy="100" r="55" fill="transparent" id="pieCenterTap" style="cursor:pointer;"></circle>' +
        buildDonutCenterText([
          { text: formatWon(Math.abs(remaining)), size:16, weight:700, color: isOver ? '#E2574C' : '#EDEEF2', dy:-3 },
          { text: isOver ? 'over budget' : 'left this month', size:9, weight:600, color:'#8B909C', dy:12 }
        ]);
      hasCenterTap = true;
    }

    var chart = '<div class="chart-wrap"><svg viewBox="0 0 200 200" width="200" height="200">' + buildDonut(chartVals, chartOrder) + centerHtml + '</svg></div>';
    var legendHtml = '<div class="legend">' + buildLegend(chartVals, chartOrder, formatWon) + '</div>';

    var body = data.rows.map(function(e){
      var rowIdx = expenses.indexOf(e);
      var d = new Date(e.date);
      var dateStr = d.toLocaleDateString(undefined, { month:'short', day:'numeric' });
      var label = LABELS[e.category] || e.category;
      if(e.installment) label += ' (' + e.installment.index + '/' + e.installment.total + ')';
      var noteHtml = e.note ? '<span class="row-note">' + escapeHtml(e.note) + '</span>' : '';
      return '<tr data-expense-idx="' + rowIdx + '"><td>' + dateStr + '</td><td>' + label + noteHtml + '</td><td>' + formatWon(e.amount) + '</td></tr>';
    }).join('');
    var table = '<table class="history-table money-table"><thead><tr><th>Date</th><th>Category</th><th>Amount</th></tr></thead><tbody>' + body + '</tbody></table>';

    moneyCard.innerHTML = nav + chart + legendHtml + table;
    if(hasCenterTap){
      var centerTapEl = document.getElementById('pieCenterTap');
      if(centerTapEl) centerTapEl.addEventListener('click', openMoneyBudgetPrompt);
    }
    var rowEls = moneyCard.querySelectorAll('[data-expense-idx]');
    for(var i=0;i<rowEls.length;i++){
      (function(tr){
        tr.addEventListener('click', function(){
          var idx = parseInt(tr.getAttribute('data-expense-idx'), 10);
          deleteExpenseAt(idx);
        });
      })(rowEls[i]);
    }
    wireMoneyMonthNav();
  }

  // tap-to-delete on a history row: confirms with the entry's details, then
  // removes exactly that entry from the master list (indexOf lookup above
  // works because computeMoneyMonth's rows hold the same object references,
  // not copies, regardless of the table's newest-first sort order)
  function deleteExpenseAt(idx){
    var e = expenses[idx];
    if(!e) return;
    var label = LABELS[e.category] || e.category;
    if(e.installment) label += ' (' + e.installment.index + '/' + e.installment.total + ')';
    var d = new Date(e.date);
    var dateStr = d.toLocaleDateString(undefined, { month:'short', day:'numeric' });
    var msg = 'Delete ' + formatWon(e.amount) + ' for ' + label + ' on ' + dateStr + (e.note ? ' (' + e.note + ')' : '') + '?';
    if(!window.confirm(msg)) return;
    expenses.splice(idx, 1);
    saveExpenses(expenses);
    renderMoney();
  }

  function wireMoneyMonthNav(){
    var prev = document.getElementById('prevMoneyMonth');
    var next = document.getElementById('nextMoneyMonth');
    if(prev) prev.addEventListener('click', function(){ viewMonthMoney = shiftMonth(viewMonthMoney, -1); renderMoney(); });
    if(next) next.addEventListener('click', function(){ viewMonthMoney = shiftMonth(viewMonthMoney, 1); renderMoney(); });
  }

  // ---- dynamic category buttons: normal mode logs an expense on tap,
  // edit mode renames/deletes on tap and shows an "add category" button ----
  function renderMoneyButtons(){
    var html = moneyCategories.map(function(c, idx){
      var isLastOdd = (idx === moneyCategories.length - 1) && (moneyCategories.length % 2 === 1) && !editingMoney;
      var cls = 'btn' + (isLastOdd ? ' money-btn-wide' : '');

  function editCategory(id){
    var cat = moneyCategories.filter(function(c){ return c.id === id; })[0];
    if(!cat) return;
    var input = window.prompt('Rename "' + cat.label + '", or clear the text and confirm to remove this button:', cat.label);
    if(input === null) return;
    var trimmed = input.trim();
    if(trimmed === ''){
      var sure = window.confirm('Remove the "' + cat.label + '" button? Anything already logged under it stays in your history.');
      if(!sure) return;
      moneyCategories = moneyCategories.filter(function(c){ return c.id !== id; });
    } else {
      cat.label = trimmed;
      LABELS[id] = trimmed;
    }
    saveMoneyCategories(moneyCategories);
    renderMoneyButtons();
    renderMoney();

  function addCategory(){
    var input = window.prompt('New category name:');
    if(input === null) return;
    var trimmed = input.trim();
    if(!trimmed){ window.alert('Enter a name first.'); return; }
    var existingIds = moneyCategories.map(function(c){ return c.id; });
    var id = slugify(trimmed, existingIds);
    var color = nextColor(moneyCategories);
    moneyCategories.push({ id: id, label: trimmed, color: color });
    COLORS[id] = color;
    LABELS[id] = trimmed;
    saveMoneyCategories(moneyCategories);
    renderMoneyButtons();
    renderMoney();
  }

  function commitExpense(category, amount, note){
    var entry = { category: category, amount: Math.round(amount), date: new Date().toISOString() };
    if(note) entry.note = note;
    expenses.push(entry);
    saveExpenses(expenses);
    renderMoney();
  }

  // splits a total into N monthly entries dated this month, next month, and
  // so on (clamped so odd days like the 31st never skip a short month).
  // Rounding remainder goes to the earliest months, one won at a time, so
  // the entries always sum to exactly the original total.
  function commitInstallments(category, totalAmount, months, note){
    var groupId = 'grp_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    var base = Math.floor(totalAmount / months);
    var remainder = totalAmount - base * months;
    var now = new Date();
    for(var i = 0; i < months; i++){
      var amt = base + (i < remainder ? 1 : 0);
      var d = addMonthsClamped(now, i);
      var entry = {
        category: category,
        amount: amt,
        date: d.toISOString(),
        installment: { groupId: groupId, index: i + 1, total: months }
      };
      if(note) entry.note = note;
      expenses.push(entry);
    }
    saveExpenses(expenses);
    renderMoney();
  }

  // live comma formatting for the amount box: strip everything but digits,
  // then re-insert a comma every 3 digits from the right
  function formatAmountDigits(raw){
    var digits = String(raw).replace(/[^0-9]/g, '');
    digits = digits.replace(/^0+(?=\d)/, '');
    if(!digits) return '';
    return digits.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }
  function rawAmountValue(formatted){
    return String(formatted).replace(/[^0-9]/g, '');
  }

  function saveExpenseFromModal(){
    if(!activeExpenseCategory) return;
    var cleaned = rawAmountValue(expenseAmountInput.value);
    var n = parseFloat(cleaned);
    if(!cleaned || isNaN(n) || n <= 0){
      window.alert('Enter a number greater than 0.');
      return;
    }
    var note = expenseNoteInput.value.trim();
    if(installmentToggle.checked && selectedInstallmentMonths > 1){
      commitInstallments(activeExpenseCategory, Math.round(n), selectedInstallmentMonths, note);
    } else {
      commitExpense(activeExpenseCategory, n, note);
    }
    closeExpenseModal();
  }

  // kept for tests / any direct programmatic logging; the on-screen flow
  // now goes through the modal above instead of a prompt
  function logExpense(category, amount){
    commitExpense(category, amount);
  }

  // if the most recent entry was part of an installment group, undo removes
  // the whole group together, never leaving a broken 2-of-3 behind
  function undoLastExpense(){
    if(!expenses.length) return;
    var last = expenses[expenses.length - 1];
    if(last.installment && last.installment.groupId){
      var gid = last.installment.groupId;
      expenses = expenses.filter(function(e){ return !(e.installment && e.installment.groupId === gid); });
    } else {
      expenses.pop();
    }
    saveExpenses(expenses);
    renderMoney();
  }

  // ---- receipt scan: OCR reads the image, finds the largest plausible
  // number, and drops it straight into the amount box in the modal that's
  // already open, so it can be reviewed before saving. The photo itself is
  // never saved anywhere, only the confirmed number is. ----
  function extractLikelyAmount(text){
    var matches = String(text).match(/[0-9][0-9,]*(\.[0-9]+)?/g);
    if(!matches) return null;
    var nums = matches
      .map(function(m){ return parseFloat(m.replace(/,/g, '')); })
      .filter(function(n){ return !isNaN(n) && n > 0; });
    if(!nums.length) return null;
    return Math.round(Math.max.apply(null, nums));
  }

  function runOcr(file){
    var category = activeExpenseCategory;
    expenseScanBtn.disabled = true;
    expenseScanBtn.textContent = 'Reading image\u2026';
    if(typeof Tesseract === 'undefined'){
      resetScanButton();
      window.alert("The scanner didn't load, check your connection. You can still type the amount.");
      return;
    }
    return Tesseract.createWorker('eng').then(function(worker){
      return worker.recognize(file).then(function(result){
        return worker.terminate().then(function(){ return result; });
      });
    }).then(function(result){
      resetScanButton();
      if(category !== activeExpenseCategory) return; // modal moved on while scanning
      var text = (result && result.data && result.data.text) || '';
      var amount = extractLikelyAmount(text);
      if(amount === null){
        window.alert("Couldn't find a clear amount in that image. You can still type it.");
      } else {
        expenseAmountInput.value = formatAmountDigits(String(amount));
        expenseAmountInput.focus();
      }
    }).catch(function(){
      resetScanButton();
      window.alert('Something went wrong reading that image. You can still type the amount.');
    });
  }

    budgetModalOverlay.style.display = 'flex';

    moneyBudget = cleaned ? parseInt(cleaned, 10) : 0;

  // ===== Plan my day · catch-up prompts · side quests =====
  // New day-agnostic keys: dtk_plan, dtk_quests, dtk_nudge. Planned time only
  // ever lands in dtk_sessions as ordinary {type,start,end} entries, so the
  // pie, history and undo keep working exactly as before. A web app can't run
  // while it's closed, so everything here is worked out when the app opens,
  // comes back to the front, or ticks while open.
  var MIN_MS = 60000;
  var BREAK_MIN = 15;
  var WORK_BLOCK_MIN = 60;
  var STOP_PROMPT_MS = 4*3600*1000;          // "still going?" after this long
  var SLEEP_STOP_PROMPT_MS = 12*3600*1000;   // Sleep is allowed to run longer
  var GAP_PROMPT_MS = 45*60*1000;            // ignore untracked gaps shorter than this
  var GAP_LOOKBACK_MS = 16*3600*1000;        // never suggest filling more than this far back
  var QUEST_QUIET_UNTIL_HOUR = 8;            // no side-quest ideas from midnight to 8 AM
  var QUEST_BREAK_BUFFER_MS = 20*60*1000;    // breaks stay clear: no quest ideas for 20 min after a timer stops
  var SNOOZE_MS = 2*3600*1000;
  var DEFAULT_QUESTS = [
    { id:'q_photos', label:'Organize Instagram photos', minutes:30 },
    { id:'q_slides', label:'Work on presentation', minutes:30 }
  ];

  function loadJson(key, fallback){
    try{
      var raw = localStorage.getItem(key);
      if(raw !== null) return JSON.parse(raw);
    }catch(e){}
    return fallback;
  }
  function saveJson(key, value){
    try{ localStorage.setItem(key, JSON.stringify(value)); }catch(e){}
  }

  var plan = loadJson('dtk_plan', []);
  if(!Array.isArray(plan)) plan = [];

  // Repeating plans: small templates {id,type,from,to,breaks,days,done}. Each
  // day the app is open, a template turns into ordinary plan blocks (tagged
  // rep:<id>). `done` remembers which days were already handled so a block
  // that got logged, cut short or skipped is never created a second time.
  var DAY_MS = 24*3600*1000;
  var DAY_NAMES = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var DAY_ORDER = [1,2,3,4,5,6,0];                 // shown Monday first
  var REPEAT_DONE_KEEP = 5;
  function sanitizeRepeats(list){
    if(!Array.isArray(list)) return [];
    var out = [];
    list.forEach(function(r){
      if(!r || typeof r.id !== 'string' || typeof r.type !== 'string') return;
      var re = /^\d\d:\d\d$/;
      if(!re.test(r.from) || !re.test(r.to) || !Array.isArray(r.days)) return;
      var days = [];
      r.days.forEach(function(d){
        if(typeof d === 'number' && d >= 0 && d <= 6 && d === Math.floor(d) && days.indexOf(d) < 0) days.push(d);
      });
      if(!days.length) return;
      var f = r.from.split(':'), t = r.to.split(':');
      var span = (Number(t[0])*60 + Number(t[1])) - (Number(f[0])*60 + Number(f[1]));
      if(span <= 0) span += 24*60;
      if(span > 16*60) return;                       // same 16-hour limit as the modal
      var done = Array.isArray(r.done) ? r.done.filter(function(k){ return typeof k === 'string'; }) : [];
      out.push({ id:r.id, type:r.type, from:r.from, to:r.to, breaks:r.breaks !== false, days:days, done:done.slice(-REPEAT_DONE_KEEP) });
    });
    return out;
  }
  var repeats = sanitizeRepeats(loadJson('dtk_plan_repeats', []));
  var planRepeatMode = 'never';                    // never | daily | weekdays | custom
  var planRepeatDays = [];
  var quests = loadJson('dtk_quests', null);
  if(!Array.isArray(quests)){
    quests = DEFAULT_QUESTS.map(function(q){ return { id:q.id, label:q.label, minutes:q.minutes, last:null }; });
  }
  var nudgeState = loadJson('dtk_nudge', {});
  if(!nudgeState || typeof nudgeState !== 'object' || Array.isArray(nudgeState)) nudgeState = {};
  var nudge = null;
  var nudgeSigShown = null;
  var planHtmlShown = null;
  var questSkipped = [];
  var lastNudgeCheckAt = 0;
  var planSelectedCategory = null;

  function fmtTod(ms){
    return new Date(ms).toLocaleTimeString(undefined, { hour:'numeric', minute:'2-digit' });
  }
  function toHHMM(ms){
    var d = new Date(ms);
    return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  }
  // the most recent moment at or before refMs that reads HH:MM on the clock
  function latestTimeBefore(str, refMs){
    var p = str.split(':');
    var d = new Date(refMs);
    d.setHours(Number(p[0]), Number(p[1]), 0, 0);
    if(d.getTime() > refMs) d.setDate(d.getDate() - 1);
    return d.getTime();
  }
  function timeOnDay(baseMs, str){
    var p = str.split(':');
    var d = new Date(baseMs);
    d.setHours(Number(p[0]), Number(p[1]), 0, 0);
    return d.getTime();
  }

  // closes the running timer into a normal session. If it was a timed side
  // quest, that quest is also marked as just done so the next suggestion
  // rotates to a different one.
  function closeActive(endIso){
    if(!active) return;
    sessions.push({ type: active.type, start: active.start, end: endIso });
    if(active.quest) markQuestDone(active.quest.id, new Date(endIso).getTime());
    saveSessions(sessions);
  }
  function markQuestDone(id, ms){
    for(var i = 0; i < quests.length; i++){
      if(quests[i].id === id){ quests[i].last = new Date(ms).toISOString(); }
    }
    saveJson('dtk_quests', quests);
  }

  // the parts of [startMs,endMs] not already covered by tracked time or a
  // running timer. Manual tracking always wins over the plan, so nothing is
  // ever counted twice.
  function freeSegments(startMs, endMs){
    var busy = [];
    sessions.forEach(function(s){
      var a = new Date(s.start).getTime(), b = new Date(s.end).getTime();
      if(b > startMs && a < endMs) busy.push([Math.max(a, startMs), Math.min(b, endMs)]);
    });
    if(active){
      var as = new Date(active.start).getTime();
      if(as < endMs) busy.push([Math.max(as, startMs), endMs]);
    }
    busy.sort(function(x, y){ return x[0] - y[0]; });
    var out = [], cursor = startMs;
    busy.forEach(function(iv){
      if(iv[0] > cursor) out.push([cursor, iv[0]]);
      if(iv[1] > cursor) cursor = iv[1];
    });
    if(cursor < endMs) out.push([cursor, endMs]);
    return out.filter(function(seg){ return seg[1] - seg[0] >= MIN_MS; });
  }

  // ---- plan my day ----
  // 1-hour work blocks with a 15-minute break after each. A leftover shorter
  // than a break plus 15 minutes is folded into the last work block instead
  // of leaving a tiny sliver.
  function buildPlanBlocks(type, startMs, endMs, withBreaks){
    var blocks = [], cursor = startMs;
    while(cursor < endMs){
      var workEnd = withBreaks ? Math.min(cursor + WORK_BLOCK_MIN*MIN_MS, endMs) : endMs;
      if(withBreaks && endMs - workEnd <= (BREAK_MIN + 15)*MIN_MS) workEnd = endMs;
      blocks.push({ kind:'work', type:type, start:new Date(cursor).toISOString(), end:new Date(workEnd).toISOString() });
      cursor = workEnd;
      if(withBreaks && cursor < endMs){
        var breakEnd = cursor + BREAK_MIN*MIN_MS;
        blocks.push({ kind:'break', start:new Date(cursor).toISOString(), end:new Date(breakEnd).toISOString() });
        cursor = breakEnd;
      }
    }
    return blocks;
  }

  function dayKey(ms){
    var d = new Date(ms);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }

  // Turns repeating templates into real plan blocks for today, plus
  // yesterday's run if it crossed midnight into today. Older missed days are
  // never filled in. A run that overlaps blocks already in the plan is skipped
  // (what you planned by hand wins). Returns true if blocks were added.
  function applyRepeats(){
    if(!repeats.length) return false;
    var now = Date.now(), t0 = new Date(now);
    t0.setHours(0, 0, 0, 0);
    t0 = t0.getTime();
    var touched = false, added = false;
    repeats.forEach(function(r){
      if(!timeCategories.some(function(c){ return c.id === r.type; })) return;   // category was deleted
      [-1, 0].forEach(function(off){
        var base = new Date(t0);
        base.setDate(base.getDate() + off);
        var key = dayKey(base.getTime());
        if(r.days.indexOf(base.getDay()) < 0 || r.done.indexOf(key) >= 0) return;
        var st = timeOnDay(base.getTime(), r.from), en = timeOnDay(base.getTime(), r.to);
        if(en <= st) en += DAY_MS;
        if(off === -1 && en <= t0) return;            // yesterday only counts if it runs into today
        r.done.push(key);
        touched = true;
        var clash = plan.some(function(b){
          return new Date(b.start).getTime() < en && new Date(b.end).getTime() > st;
        });
        if(clash) return;
        buildPlanBlocks(r.type, st, en, r.breaks).forEach(function(b){
          b.rep = r.id;
          plan.push(b);
        });
        added = true;
      });
      r.done.sort();
      r.done = r.done.slice(-REPEAT_DONE_KEEP);
    });
    if(touched) saveJson('dtk_plan_repeats', repeats);
    if(added){
      plan.sort(function(a, b){ return new Date(a.start).getTime() - new Date(b.start).getTime(); });
      saveJson('dtk_plan', plan);
    }
    return added;
  }

  // logs every planned block that has finished; unfinished ones stay queued
  function syncPlan(){
    var added = applyRepeats();
    var now = Date.now(), changed = false, keep = [];
    plan.forEach(function(b){
      var end = new Date(b.end).getTime();
      if(end > now){ keep.push(b); return; }
      changed = true;
      if(b.kind === 'work'){
        var start = new Date(b.start).getTime();
        freeSegments(start, end).forEach(function(seg){
          sessions.push({ type:b.type, start:new Date(seg[0]).toISOString(), end:new Date(seg[1]).toISOString(), planned:true });
        });
      }
    });
    if(changed){
      plan = keep;
      saveJson('dtk_plan', plan);
      saveSessions(sessions);
      historyDirty = true;
    }
    return changed || added;
  }

  function endPlanNow(){
    var now = Date.now(), next = [];
    plan.forEach(function(b){
      var s = new Date(b.start).getTime(), e = new Date(b.end).getTime();
      if(e <= now){ next.push(b); return; }                                    // finished: gets logged below
      if(s < now && b.kind === 'work'){ b.end = new Date(now).toISOString(); next.push(b); }   // running: cut at now
      // anything not started yet, or a break in progress, is dropped
    });
    plan = next;
    syncPlan();
    saveJson('dtk_plan', plan);
    historyDirty = true;
    renderPlan();
    render();
    checkNudges();
  }

  function currentPlanBlock(){
    var now = Date.now(), found = null;
    plan.forEach(function(b){
      var s = new Date(b.start).getTime(), e = new Date(b.end).getTime();
      if(s <= now && e > now && (!found || b.kind === 'work')) found = b;
    });
    return found;
  }
  function planInProgress(now){
    return plan.some(function(b){
      return b.kind === 'work' && new Date(b.start).getTime() <= now && new Date(b.end).getTime() > now;
    });
  }
  function planBreakNow(now){
    return plan.some(function(b){
      return b.kind === 'break' && new Date(b.start).getTime() <= now && new Date(b.end).getTime() > now;
    });
  }
  function nextPlanWorkStart(now){
    var best = Infinity;
    plan.forEach(function(b){
      var s = new Date(b.start).getTime();
      if(b.kind === 'work' && s > now && s < best) best = s;
    });
    return best;
  }

  function renderPlan(){
    var now = Date.now();
    var upcoming = plan.filter(function(b){ return new Date(b.end).getTime() > now; });
    var html = '';
    if(upcoming.length){
      var shown = upcoming.slice(0, 5);
      html = '<div class="plan-head"><span class="plan-title">Plan</span>' +
        '<button type="button" class="undo" data-act="endPlan">end plan now</button></div>' +
        shown.map(function(b){
          var s = new Date(b.start).getTime(), e = new Date(b.end).getTime();
          var live = s <= now && e > now;
          var isBreak = b.kind === 'break';
          var label = isBreak ? 'Break' : (LABELS[b.type] || b.type);
          var dot = isBreak ? 'var(--text-faint)' : (COLORS[b.type] || 'var(--text-dim)');
          return '<div class="plan-row' + (live ? ' plan-live' : '') + '">' +
            '<span class="dot" style="background:' + dot + ';"></span>' +
            '<span class="plan-label">' + escapeHtml(label) + (b.rep ? '<span class="plan-rep">repeat</span>' : '') + '</span>' +
            '<span class="plan-time">' + fmtTod(s) + '–' + fmtTod(e) + (live ? ' · now' : '') + '</span></div>';
        }).join('') +
        (upcoming.length > shown.length ? '<div class="plan-more">+' + (upcoming.length - shown.length) + ' more</div>' : '');
    }
    if(html === planHtmlShown) return;
    planHtmlShown = html;
    planCard.innerHTML = html;
    planCard.style.display = html ? 'block' : 'none';
  }

  function renderPlanCategoryChips(){
    planCategoryChips.innerHTML = timeCategories.map(function(c){
      return '<button type="button" class="installment-chip" data-plan-type="' + c.id + '" data-selected="' + (c.id === planSelectedCategory) + '">' + escapeHtml(c.label) + '</button>';
    }).join('');
  }
  function planRangeFromInputs(){
    if(!planStartInput.value || !planEndInput.value) return null;
    var base = Date.now();
    var st = timeOnDay(base, planStartInput.value);
    var en = timeOnDay(base, planEndInput.value);
    if(en <= st) en += 24*3600*1000;      // an earlier end time means it runs past midnight
    return [st, en];
  }
  // ---- repeat choices inside the plan modal ----
  function repeatDaysFor(mode){
    if(mode === 'daily') return [0,1,2,3,4,5,6];
    if(mode === 'weekdays') return [1,2,3,4,5];
    if(mode === 'custom') return planRepeatDays.slice();
    return [];
  }
  function repeatPhrase(days){
    if(days.length === 7) return 'Every day';
    if(days.length === 5 && [1,2,3,4,5].every(function(d){ return days.indexOf(d) >= 0; })) return 'Every weekday';
    return 'Every ' + DAY_ORDER.filter(function(d){ return days.indexOf(d) >= 0; }).map(function(d){ return DAY_NAMES[d]; }).join(', ');
  }
  function renderPlanRepeatChips(){
    var opts = [['never','Never'], ['daily','Every day'], ['weekdays','Weekdays'], ['custom','Pick days']];
    planRepeatChips.innerHTML = opts.map(function(o){
      return '<button type="button" class="installment-chip" data-plan-repeat="' + o[0] + '" data-selected="' + (o[0] === planRepeatMode) + '">' + o[1] + '</button>';
    }).join('');
    planDayChips.style.display = planRepeatMode === 'custom' ? 'flex' : 'none';
    planDayChips.innerHTML = DAY_ORDER.map(function(d){
      return '<button type="button" class="day-chip" data-plan-day="' + d + '" data-selected="' + (planRepeatDays.indexOf(d) >= 0) + '">' + DAY_NAMES[d] + '</button>';
    }).join('');
  }
  function renderPlanRepeatList(){
    if(!repeats.length){ planRepeatList.innerHTML = ''; return; }
    var now = Date.now();
    planRepeatList.innerHTML = '<div class="repeat-list"><div class="installment-label">Repeating</div>' +
      repeats.map(function(r){
        var dot = COLORS[r.type] || 'var(--text-dim)';
        return '<div class="repeat-row"><span class="dot" style="background:' + dot + ';"></span>' +
          '<span class="repeat-info"><b>' + escapeHtml(LABELS[r.type] || r.type) + '</b> ' +
          fmtTod(timeOnDay(now, r.from)) + '–' + fmtTod(timeOnDay(now, r.to)) +
          '<span class="repeat-sub">' + escapeHtml(repeatPhrase(r.days)) + '</span></span>' +
          '<button type="button" class="undo repeat-stop" data-repeat-stop="' + escapeHtml(r.id) + '">Stop</button></div>';
      }).join('') + '</div>';
  }
  // stops a repeat: no new days get planned, and its blocks that haven't
  // started yet are removed. Whatever is running or already logged stays.
  function stopRepeat(id){
    var now = Date.now();
    repeats = repeats.filter(function(r){ return r.id !== id; });
    saveJson('dtk_plan_repeats', repeats);
    plan = plan.filter(function(b){ return !(b.rep === id && new Date(b.start).getTime() > now); });
    saveJson('dtk_plan', plan);
    renderPlanRepeatList();
    renderPlan();
    checkNudges();
  }
  function setPlanRepeatMode(mode){
    planRepeatMode = mode;
    if(mode === 'custom' && !planRepeatDays.length) planRepeatDays = [new Date().getDay()];
    renderPlanRepeatChips();
    updatePlanPreview();
  }
  function togglePlanDay(d){
    var i = planRepeatDays.indexOf(d);
    if(i >= 0){
      if(planRepeatDays.length === 1) return;        // keep at least one day picked
      planRepeatDays.splice(i, 1);
    } else {
      planRepeatDays.push(d);
    }
    renderPlanRepeatChips();
    updatePlanPreview();
  }

  function updatePlanPreview(){
    var range = planRangeFromInputs();
    if(!range || !planSelectedCategory){ planPreview.textContent = ''; return; }
    var blocks = buildPlanBlocks(planSelectedCategory, range[0], range[1], planBreakToggle.checked);
    var workMs = 0, breaks = 0;
    blocks.forEach(function(b){
      if(b.kind === 'break') breaks++;
      else workMs += new Date(b.end).getTime() - new Date(b.start).getTime();
    });
    var repDays = repeatDaysFor(planRepeatMode);
    planPreview.textContent = 'Logs ' + formatHM(workMs) + ' of ' + (LABELS[planSelectedCategory] || planSelectedCategory) +
      (breaks ? ' · ' + breaks + ' break' + (breaks > 1 ? 's' : '') + ' of ' + BREAK_MIN + ' min' : '') +
      (repDays.length ? ' · then ' + repeatPhrase(repDays).replace(/^E/, 'e') : '');
  }
  function openPlanModal(){
    planSelectedCategory = timeCategories.length ? timeCategories[0].id : null;
    if(!planSelectedCategory){ window.alert('Add a category first.'); return; }
    renderPlanCategoryChips();
    var d = new Date();
    d.setMinutes(Math.round(d.getMinutes() / 5) * 5, 0, 0);
    planStartInput.value = toHHMM(d.getTime());
    planEndInput.value = '';
    planBreakToggle.checked = true;
    planRepeatMode = 'never';
    planRepeatDays = [];
    renderPlanRepeatChips();
    renderPlanRepeatList();
    updatePlanPreview();
    planModalOverlay.style.display = 'flex';
  }
  function closePlanModal(){
    planModalOverlay.style.display = 'none';
  }
  function savePlanFromModal(){
    var range = planRangeFromInputs();
    if(!range){ window.alert('Fill in both times.'); return; }
    if(range[1] - range[0] > 16*3600*1000){ window.alert('That is longer than 16 hours, check the times.'); return; }
    var blocks = buildPlanBlocks(planSelectedCategory, range[0], range[1], planBreakToggle.checked);
    // the new plan replaces any older planned blocks it overlaps
    plan = plan.filter(function(b){
      var bs = new Date(b.start).getTime(), be = new Date(b.end).getTime();
      return be <= range[0] || bs >= range[1];
    }).concat(blocks);
    plan.sort(function(a, b){ return new Date(a.start).getTime() - new Date(b.start).getTime(); });
    saveJson('dtk_plan', plan);
    // a repeat starts from the next day: today (and yesterday's overnight run)
    // count as handled, since the blocks above are today's run
    var repDays = repeatDaysFor(planRepeatMode);
    if(repDays.length){
      var yest = new Date(range[0]);
      yest.setDate(yest.getDate() - 1);
      var tpl = {
        id: 'r_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
        type: planSelectedCategory, from: planStartInput.value, to: planEndInput.value,
        breaks: planBreakToggle.checked, days: repDays, done: [dayKey(yest.getTime()), dayKey(range[0])]
      };
      repeats = repeats.filter(function(r){ return !(r.type === tpl.type && r.from === tpl.from && r.to === tpl.to); });
      repeats.push(tpl);
      saveJson('dtk_plan_repeats', repeats);
    }
    syncPlan();
    historyDirty = true;
    closePlanModal();
    renderPlan();
    render();
    checkNudges();
  }

  // ---- catch-up prompts + side quests (one card at a time) ----
  function lastSessionEnd(now){
    var best = 0;
    sessions.forEach(function(s){
      var e = new Date(s.end).getTime();
      if(e <= now && e > best) best = e;
    });
    return best;
  }
  function questType(){
    for(var i = 0; i < timeCategories.length; i++){
      if(timeCategories[i].id === 'productive') return 'productive';
    }
    return timeCategories.length ? timeCategories[0].id : null;
  }
  // least recently done first, and only ones that fit before the next
  // planned work block. Quiet overnight, and never during a break: not while
  // a planned break is running, and not for 20 minutes after any timer stops
  // (that is almost always a walk / eye rest, planned in the app or not).
  function pickQuest(now){
    if(!quests.length || new Date(now).getHours() < QUEST_QUIET_UNTIL_HOUR) return null;
    if(planBreakNow(now) || now - lastSessionEnd(now) < QUEST_BREAK_BUFFER_MS) return null;
    var freeFor = nextPlanWorkStart(now) - now;
    function candidates(){
      return quests.filter(function(q){
        return q.minutes*MIN_MS <= freeFor && questSkipped.indexOf(q.id) === -1;
      });
    }
    var fits = candidates();
    if(!fits.length && questSkipped.length){ questSkipped = []; fits = candidates(); }
    if(!fits.length) return null;
    fits.sort(function(a, b){
      return (a.last ? new Date(a.last).getTime() : 0) - (b.last ? new Date(b.last).getTime() : 0);
    });
    return fits[0];
  }

  function nudgeSig(n){
    if(!n) return 'none';
    if(n.kind === 'stop') return 'stop|' + (active ? active.start : '');
    if(n.kind === 'gap') return 'gap|' + n.anchor;
    if(n.kind === 'quest') return 'quest|' + n.quest.id;
    return 'done|' + n.quest.id + '|' + n.at;
  }

  function checkNudges(){
    syncPlan();
    var now = Date.now();
    if(nudge && nudge.kind === 'done' && now - nudge.at < 10*MIN_MS){ renderNudge(); return; }
    var next = null;
    if(active){
      if(!active.quest){
        var el = now - new Date(active.start).getTime();
        var limit = active.type === 'sleep' ? SLEEP_STOP_PROMPT_MS : STOP_PROMPT_MS;
        if(el >= limit && now >= (nudgeState.stopSnoozeUntil || 0)) next = { kind:'stop' };
      }
    } else if(!planInProgress(now)){
      var lastEnd = lastSessionEnd(now);
      var from = Math.max(lastEnd, now - GAP_LOOKBACK_MS);
      if(lastEnd > 0 && now - from >= GAP_PROMPT_MS && nudgeState.gapDismissed !== lastEnd){
        next = { kind:'gap', from:from, to:now, anchor:lastEnd, fromStr:toHHMM(from), toStr:toHHMM(now) };
      } else if(now >= (nudgeState.questSnoozeUntil || 0)){
        var q = pickQuest(now);
        if(q) next = { kind:'quest', quest:{ id:q.id, label:q.label, minutes:q.minutes } };
      }
    }
    // keep the existing card object when nothing changed, so a half-typed time isn't reset
    if(!(nudge && next && nudgeSig(nudge) === nudgeSig(next))) nudge = next;
    renderNudge();
  }

  function renderNudge(){
    var sig = nudgeSig(nudge);
    if(sig === nudgeSigShown) return;
    nudgeSigShown = sig;
    if(!nudge){
      nudgeCard.style.display = 'none';
      nudgeCard.innerHTML = '';
      return;
    }
    var html = '';
    if(nudge.kind === 'stop' && active){
      var startMs = new Date(active.start).getTime();
      html = '<div class="nudge-title">Still on ' + escapeHtml(LABELS[active.type] || active.type) + '?</div>' +
        '<div class="nudge-sub">Running ' + formatHM(Date.now() - startMs) + ' since ' + fmtTod(startMs) + '. Did you forget to stop it?</div>' +
        '<div class="nudge-actions">' +
          '<button type="button" class="nudge-btn primary" data-act="stopNow">Stop now</button>' +
          '<button type="button" class="nudge-btn" data-act="keep">Still going</button>' +
        '</div>' +
        '<div class="nudge-times"><span>It ended at</span><input type="time" id="nudgeStopAt">' +
          '<button type="button" class="nudge-btn" data-act="stopAt">Stop then</button></div>';
    } else if(nudge.kind === 'gap'){
      html = '<div class="nudge-title">Nothing tracked ' + fmtTod(nudge.from) + ' – ' + fmtTod(nudge.to) + '</div>' +
        '<div class="nudge-sub">That is ' + formatHM(nudge.to - nudge.from) + '. What was it?</div>' +
        '<div class="nudge-times"><input type="time" id="gapFromInput" value="' + nudge.fromStr + '"><span>to</span>' +
          '<input type="time" id="gapToInput" value="' + nudge.toStr + '"></div>' +
        '<div class="nudge-actions">' +
          timeCategories.map(function(c){
            return '<button type="button" class="nudge-btn" data-act="gap" data-type="' + c.id + '">' + escapeHtml(c.label) + '</button>';
          }).join('') +
          '<button type="button" class="nudge-btn" data-act="gapSkip">Just Other</button>' +
        '</div>';
    } else if(nudge.kind === 'quest'){
      html = '<div class="nudge-title">Free for a bit? Try a side quest</div>' +
        '<div class="nudge-sub"><b>' + escapeHtml(nudge.quest.label) + '</b> · ' + nudge.quest.minutes + ' min. The timer stops it for you.</div>' +
        '<div class="nudge-actions">' +
          '<button type="button" class="nudge-btn primary" data-act="questStart">Start ' + nudge.quest.minutes + ' min</button>' +
          '<button type="button" class="nudge-btn" data-act="questNext">Another</button>' +
          '<button type="button" class="nudge-btn" data-act="questLater">Not now</button>' +
        '</div>';
    } else if(nudge.kind === 'done'){
      html = '<div class="nudge-title">Time is up</div>' +
        '<div class="nudge-sub">Logged ' + nudge.quest.minutes + ' min on <b>' + escapeHtml(nudge.quest.label) + '</b>. Nice. Stop here, or take 15 more?</div>' +
        '<div class="nudge-actions">' +
          '<button type="button" class="nudge-btn primary" data-act="dismiss">Done</button>' +
          '<button type="button" class="nudge-btn" data-act="questMore">+15 min</button>' +
        '</div>';
    }
    nudgeCard.innerHTML = html;
    nudgeCard.style.display = html ? 'block' : 'none';
  }

  function stopActiveAt(endMs){
    if(!active) return;
    closeActive(new Date(endMs).toISOString());
    active = null;
    saveActive(null);
    historyDirty = true;
    renderTimeButtons();
    render();
    checkNudges();
  }

  function logGapAs(type){
    var n = nudge;
    if(!n || n.kind !== 'gap') return;
    var fromEl = document.getElementById('gapFromInput');
    var toEl = document.getElementById('gapToInput');
    if(!fromEl.value || !toEl.value){ window.alert('Fill in both times.'); return; }
    var toMs = Date.now();
    if(toEl.value !== n.toStr) toMs = latestTimeBefore(toEl.value, Date.now());
    var fromMs = n.from;
    if(fromEl.value !== n.fromStr) fromMs = latestTimeBefore(fromEl.value, toMs);
    if(fromMs < n.from){ window.alert('That starts before the untracked time does (' + fmtTod(n.from) + '). Pick a later start.'); return; }
    if(!(toMs > fromMs)){ window.alert('"To" has to come after "From".'); return; }
    freeSegments(fromMs, toMs).forEach(function(seg){
      sessions.push({ type:type, start:new Date(seg[0]).toISOString(), end:new Date(seg[1]).toISOString() });
    });
    saveSessions(sessions);
    historyDirty = true;
    render();
    checkNudges();
  }

  function startQuest(q){
    var type = questType();
    if(!type || active) return;
    active = { type:type, start:new Date().toISOString(), quest:{ id:q.id, label:q.label, limitMs:q.minutes*MIN_MS } };
    saveActive(active);
    historyDirty = true;
    nudge = null;
    renderTimeButtons();
    render();
    checkNudges();
  }

  // a timed quest ends itself: only the time limit is logged, even if the app
  // was closed when the time ran out
  function finishQuest(){
    if(!active || !active.quest) return;
    var q = active.quest;
    var endMs = new Date(active.start).getTime() + q.limitMs;
    sessions.push({ type:active.type, start:active.start, end:new Date(endMs).toISOString() });
    markQuestDone(q.id, endMs);
    saveSessions(sessions);
    active = null;
    saveActive(null);
    historyDirty = true;
    nudge = { kind:'done', quest:{ id:q.id, label:q.label, minutes:Math.round(q.limitMs/MIN_MS) }, at:Date.now() };
    renderTimeButtons();
    render();
    renderNudge();
  }

  function handleNudgeAction(act, el){
    var now = Date.now();
    if(act === 'endPlan'){
      if(window.confirm('End the plan here? Time so far stays logged and the rest is cancelled.')) endPlanNow();
      return;
    }
    if(!nudge) return;
    if(act === 'stopNow'){
      stopActiveAt(now);
    } else if(act === 'keep'){
      nudgeState.stopSnoozeUntil = now + SNOOZE_MS;
      saveJson('dtk_nudge', nudgeState);
      nudge = null;
      renderNudge();
    } else if(act === 'stopAt'){
      var v = document.getElementById('nudgeStopAt').value;
      if(!v){ window.alert('Pick the time it ended.'); return; }
      var endMs = latestTimeBefore(v, now);
      if(!active || endMs <= new Date(active.start).getTime()){ window.alert('That is before it started.'); return; }
      stopActiveAt(endMs);
    } else if(act === 'gap'){
      logGapAs(el.getAttribute('data-type'));
    } else if(act === 'gapSkip'){
      nudgeState.gapDismissed = nudge.anchor;
      saveJson('dtk_nudge', nudgeState);
      nudge = null;
      checkNudges();
    } else if(act === 'questStart'){
      startQuest(nudge.quest);
    } else if(act === 'questNext'){
      questSkipped.push(nudge.quest.id);
      nudge = null;
      checkNudges();
    } else if(act === 'questLater'){
      nudgeState.questSnoozeUntil = now + SNOOZE_MS;
      saveJson('dtk_nudge', nudgeState);
      nudge = null;
      renderNudge();
    } else if(act === 'questMore'){
      startQuest({ id:nudge.quest.id, label:nudge.quest.label, minutes:15 });
    } else if(act === 'dismiss'){
      nudge = null;
      checkNudges();
    }
  }

  // ---- side quest list ----
  function renderQuestList(){
    questList.innerHTML = quests.length ? quests.map(function(q, i){
      return '<div class="quest-row"><div class="quest-name">' + escapeHtml(q.label) +
        '<span class="row-note">' + q.minutes + ' min</span></div>' +
        '<button type="button" class="quest-del" data-act="delQuest" data-qi="' + i + '">✕</button></div>';
    }).join('') : '<div class="history-empty" style="padding:12px 4px;">No side quests yet.</div>';
  }
  function openQuestModal(){
    renderQuestList();
    questModalOverlay.style.display = 'flex';
  }
  function closeQuestModal(){
    questModalOverlay.style.display = 'none';
    checkNudges();
  }
  function addQuest(){
    var name = window.prompt('Side quest name (like "Organize photos"):');
    if(name === null) return;
    name = name.trim();
    if(!name) return;
    var raw = window.prompt('How many minutes?', '30');
    if(raw === null) return;
    var n = parseInt(raw, 10);
    if(isNaN(n) || n < 5 || n > 180){ window.alert('Pick a number of minutes between 5 and 180.'); return; }
    quests.push({ id:'q' + Date.now(), label:name, minutes:n, last:null });
    saveJson('dtk_quests', quests);
    renderQuestList();
  }
  function deleteQuestAt(i){
    var q = quests[i];
    if(!q) return;
    if(!window.confirm('Remove "' + q.label + '"?')) return;
    quests.splice(i, 1);
    saveJson('dtk_quests', quests);
    renderQuestList();
  }

  // runs every second while the app is open
  function tick(){
    var now = Date.now();
    if(active && active.quest && now - new Date(active.start).getTime() >= active.quest.limitMs){
      finishQuest();
      return;
    }
    var due = now - lastNudgeCheckAt >= 60*1000;      // re-check the cards about once a minute
    for(var i = 0; i < plan.length && !due; i++){
      if(new Date(plan[i].end).getTime() <= now) due = true;   // a planned block just finished
    }
    if(due){
      lastNudgeCheckAt = now;
      checkNudges();
    }
    renderPlan();
  }

  // delegated clicks: these cards are rebuilt whenever their content changes
  function actFromEvent(e, container){
    var el = e.target;
    while(el && el !== container){
      if(el.getAttribute && el.getAttribute('data-act')) return el;
      el = el.parentNode;
    }
    return null;
  }
  nudgeCard.addEventListener('click', function(e){
    var el = actFromEvent(e, nudgeCard);
    if(el) handleNudgeAction(el.getAttribute('data-act'), el);
  });
  planCard.addEventListener('click', function(e){
    var el = actFromEvent(e, planCard);
    if(el) handleNudgeAction(el.getAttribute('data-act'), el);
  });
  questList.addEventListener('click', function(e){
    var el = actFromEvent(e, questList);
    if(el && el.getAttribute('data-act') === 'delQuest') deleteQuestAt(Number(el.getAttribute('data-qi')));
  });
  planCategoryChips.addEventListener('click', function(e){
    var el = e.target;
    while(el && el !== planCategoryChips){
      if(el.getAttribute && el.getAttribute('data-plan-type')){
        planSelectedCategory = el.getAttribute('data-plan-type');
        renderPlanCategoryChips();
        updatePlanPreview();
        return;
      }
      el = el.parentNode;
    }
  });

  // ---- three-dot menu: contents change based on which mode is showing ----
  function renderMenuDropdown(){
    var items = [];
    if(mode === 'time'){
      items.push({ label: 'Plan my day', action: openPlanModal });
      items.push({ label: 'Side quests', action: openQuestModal });
      items.push({ label: 'Add past entry', action: openManualTimeModal });
      items.push({
        label: editingTime ? 'Done editing categories' : 'Edit categories',
        action: function(){ editingTime = !editingTime; renderTimeButtons(); }
      });
    } else {
      items.push({
        label: editingMoney ? 'Done editing categories' : 'Edit categories',
        action: function(){ editingMoney = !editingMoney; renderMoneyButtons(); }
      });
    }
    menuDropdown.innerHTML = items.map(function(it, idx){
      return '<button type="button" class="menu-item" data-idx="' + idx + '">' + it.label + '</button>';
    }).join('');
    var btns = menuDropdown.querySelectorAll('.menu-item');
    for(var i = 0; i < btns.length; i++){
      (function(btn, item){
        btn.addEventListener('click', function(){
          item.action();
          closeMenu();
        });
      })(btns[i], items[i]);
    }
  }

  function openMenu(){
    renderMenuDropdown();
    menuDropdown.style.display = 'block';
  }
  function closeMenu(){
    menuDropdown.style.display = 'none';
  }

  function setMode(m){
    mode = m;
    modeTimeBtn.setAttribute('data-active', String(mode === 'time'));
    modeMoneyBtn.setAttribute('data-active', String(mode === 'money'));
    timeSection.style.display = mode === 'time' ? 'block' : 'none';
    moneySection.style.display = mode === 'money' ? 'block' : 'none';
    footnote.textContent = mode === 'time'
      ? "Resets at midnight. \"Other\" is whatever's left of the 24 hours."
      : 'Just logs what you tap in. Nothing here is automatic.';
    closeMenu();
    if(mode === 'time'){ renderTimeButtons(); render(); }
    else { renderMoneyButtons(); renderMoney(); }
  }

  undoBtn.addEventListener('click', undoLast);
  manualCancelBtn.addEventListener('click', closeManualTimeModal);
  manualSaveBtn.addEventListener('click', saveManualTimeEntry);
  manualTimeModalOverlay.addEventListener('click', function(e){
    if(e.target === manualTimeModalOverlay) closeManualTimeModal();
  });
  planCancelBtn.addEventListener('click', closePlanModal);
  planSaveBtn.addEventListener('click', savePlanFromModal);
  planStartInput.addEventListener('input', updatePlanPreview);
  planStartInput.addEventListener('change', updatePlanPreview);
  planEndInput.addEventListener('input', updatePlanPreview);
  planEndInput.addEventListener('change', updatePlanPreview);
  planBreakToggle.addEventListener('change', updatePlanPreview);
  function elWithAttr(e, container, attr){
    var el = e.target;
    while(el && el !== container){
      if(el.getAttribute && el.getAttribute(attr) !== null && el.getAttribute(attr) !== undefined) return el;
      el = el.parentNode;
    }
    return null;
  }
  planRepeatChips.addEventListener('click', function(e){
    var el = elWithAttr(e, planRepeatChips, 'data-plan-repeat');
    if(el) setPlanRepeatMode(el.getAttribute('data-plan-repeat'));
  });
  planDayChips.addEventListener('click', function(e){
    var el = elWithAttr(e, planDayChips, 'data-plan-day');
    if(el) togglePlanDay(Number(el.getAttribute('data-plan-day')));
  });
  planRepeatList.addEventListener('click', function(e){
    var el = elWithAttr(e, planRepeatList, 'data-repeat-stop');
    if(el) stopRepeat(el.getAttribute('data-repeat-stop'));
  });
  planModalOverlay.addEventListener('click', function(e){
    if(e.target === planModalOverlay) closePlanModal();
  });
  questAddBtn.addEventListener('click', addQuest);
  questDoneBtn.addEventListener('click', closeQuestModal);
  questModalOverlay.addEventListener('click', function(e){
    if(e.target === questModalOverlay) closeQuestModal();
  });
  // coming back to the app (Home Screen apps resume rather than reload)
  document.addEventListener('visibilitychange', function(){
    if(!document.hidden && mode === 'time'){
      checkNudges();
      renderPlan();
      render();
    }
  });
  tabToday.addEventListener('click', function(){ currentView = 'today'; render(); });
  tabHistory.addEventListener('click', function(){ currentView = 'history'; historyDirty = true; render(); });

  undoExpenseBtn.addEventListener('click', undoLastExpense);
  moneyBudgetLine.addEventListener('click', openMoneyBudgetPrompt);
  budgetAmountInput.addEventListener('input', function(){
    budgetAmountInput.value = formatAmountDigits(budgetAmountInput.value);
  });
  budgetAmountInput.addEventListener('keydown', function(e){
    if(e.key === 'Enter') saveBudgetFromModal();
  });
  budgetCancelBtn.addEventListener('click', closeBudgetModal);
  budgetSaveBtn.addEventListener('click', saveBudgetFromModal);
  budgetModalOverlay.addEventListener('click', function(e){
    if(e.target === budgetModalOverlay) closeBudgetModal();
  });
  scanFileInput.addEventListener('change', function(e){
    var file = e.target.files && e.target.files[0];
    scanFileInput.value = '';
    if(file) runOcr(file);
  });
  expenseScanBtn.addEventListener('click', function(){ scanFileInput.click(); });
  expenseCancelBtn.addEventListener('click', closeExpenseModal);
  expenseSaveBtn.addEventListener('click', saveExpenseFromModal);
  expenseAmountInput.addEventListener('keydown', function(e){
    if(e.key === 'Enter') saveExpenseFromModal();
  });
  expenseAmountInput.addEventListener('input', function(){
    expenseAmountInput.value = formatAmountDigits(expenseAmountInput.value);
    if(installmentToggle.checked) updateInstallmentPreview();
  });
  installmentToggle.addEventListener('change', function(){
    installmentPanel.style.display = installmentToggle.checked ? 'block' : 'none';
    if(installmentToggle.checked) updateInstallmentPreview();
  });
  expenseModalOverlay.addEventListener('click', function(e){
    if(e.target === expenseModalOverlay) closeExpenseModal();
  });

  menuTriggerBtn.addEventListener('click', function(e){
    e.stopPropagation();
    if(menuDropdown.style.display === 'block') closeMenu(); else openMenu();
  });
  document.addEventListener('click', function(e){
    if(menuDropdown.style.display === 'block' && e.target !== menuTriggerBtn && !menuDropdown.contains(e.target)){
      closeMenu();
    }
  });

  modeTimeBtn.addEventListener('click', function(){ setMode('time'); });
  modeMoneyBtn.addEventListener('click', function(){ setMode('money'); });

  viewMonth = currentMonthKey();
  viewMonthMoney = currentMonthKey();

  renderTimeButtons();
  renderMoneyButtons();

  setInterval(function(){
    tick();
    if(mode === 'time') render();
  }, 1000);
  syncPlan();
  checkNudges();
  renderPlan();
  setMode('time');
})();
</script>
</body>
</html>
