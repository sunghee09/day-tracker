<title>Time Is Money</title>
<style>
  :root{
    --bg:#16181D;
    --card:#1E212A;
    --border:#2A2E38;
    --text:#EDEEF2;
    --text-dim:#8B909C;
    --text-faint:#54586A;
    --work:#E8794A;
    --job:#3FBFA8;
    --productive:#E8C24A;
    --sleep:#6C6FF0;
    --other:#3A3F4B;
    --fashion:#E85A9E;
    --junk:#E2574C;
    --essentials:#4EA8E8;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;
    justify-content:center;
    padding:calc(env(safe-area-inset-top,20px) + 20px) 20px calc(env(safe-area-inset-bottom,20px) + 24px);
    min-height:100%;
  }
  .app{ width:100%; max-width:440px; }
  .eyebrow{ font-size:13px; color:var(--text-dim); letter-spacing:0.3px; }
  .title{ font-size:22px; font-weight:700; margin-top:2px; margin-bottom:16px; }
  .mode-tabs{ display:flex; gap:8px; margin-bottom:18px; }
  .mode-tab{
    flex:1;
    padding:12px;
    border-radius:12px;
    border:1px solid var(--border);
    background:var(--card);
    color:var(--text-dim);
    font-family:inherit;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    -webkit-appearance:none;
    appearance:none;
  }
  .mode-tab[data-active="true"]{ background:var(--text); color:var(--bg); border-color:var(--text); }
  .buttons{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px; }
  .btn{
    padding:18px 10px;
    border-radius:14px;
    border:1px solid var(--border);
    background:var(--card);
    color:var(--text);
    font-family:inherit;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    transition:background .15s ease, border-color .15s ease, color .15s ease;
    -webkit-appearance:none;
    appearance:none;
  }
  .btn[data-active="true"][data-type="work"]{ background:var(--work); border-color:var(--work); color:#0F1013; animation:pulse 2s ease-in-out infinite; }
  .btn[data-active="true"][data-type="job"]{ background:var(--job); border-color:var(--job); color:#0F1013; animation:pulse 2s ease-in-out infinite; }
  .btn[data-active="true"][data-type="productive"]{ background:var(--productive); border-color:var(--productive); color:#0F1013; animation:pulse 2s ease-in-out infinite; }
  .btn[data-active="true"][data-type="sleep"]{ background:var(--sleep); border-color:var(--sleep); color:#0F1013; animation:pulse 2s ease-in-out infinite; }
  .money-btn-wide{ grid-column:1 / -1; }
  .btn-dashed{ border-style:dashed; color:var(--text-dim); background:transparent; margin-bottom:10px; }
  @keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:0.82; } }
  .status-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
    min-height:20px;
  }
  .status{
    font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
    font-size:14px;
    color:var(--text-faint);
  }
  .undo{
    background:none;
    border:none;
    color:var(--text-dim);
    font-size:12px;
    text-decoration:underline;
    padding:0;
  }
  .tabs{ display:flex; gap:8px; margin-bottom:12px; }
  .tab{
    flex:1;
    padding:10px;
    border-radius:10px;
    border:1px solid var(--border);
    background:transparent;
    color:var(--text-dim);
    font-family:inherit;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    -webkit-appearance:none;
    appearance:none;
  }
  .tab[data-active="true"]{ background:var(--card); color:var(--text); }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:20px 16px 8px;
  }
  .chart-wrap{ display:flex; justify-content:center; }
  .legend{ display:flex; flex-wrap:wrap; justify-content:center; gap:14px 8px; padding:12px 0 18px; }
  .legend-item{ flex:0 0 auto; min-width:56px; text-align:center; }
  .legend-dot-row{ display:flex; align-items:center; gap:6px; justify-content:center; }
  .dot{ width:8px; height:8px; border-radius:50%; flex:none; }
  .legend-label{ font-size:12px; color:var(--text-dim); }
  .legend-value{ font-size:14px; font-weight:600; margin-top:4px; }
  .footnote{ font-size:11px; color:var(--text-faint); margin-top:16px; text-align:center; }
  .month-nav{ display:flex; align-items:center; justify-content:space-between; padding:2px 0 16px; }
  .month-arrow{
    width:34px; height:34px;
    border-radius:9px;
    border:1px solid var(--border);
    background:transparent;
    color:var(--text-dim);
    font-size:18px;
    line-height:1;
    cursor:pointer;
    -webkit-appearance:none;
    appearance:none;
  }
  .month-label{ font-size:15px; font-weight:600; }
  .month-sub{ text-align:center; font-size:11px; color:var(--text-faint); padding-bottom:16px; }
  .history-empty{ padding:28px 4px 20px; text-align:center; color:var(--text-faint); font-size:13px; }
  .history-table{ width:100%; border-collapse:collapse; }
  .history-table th{ text-align:right; font-size:10px; color:var(--text-faint); font-weight:600; padding:0 3px 9px; text-transform:uppercase; letter-spacing:0.3px; }
  .history-table th:first-child{ text-align:left; }
  .history-table td{ font-size:12px; padding:10px 3px; border-top:1px solid var(--border); text-align:right; }
  .history-table td:first-child{ text-align:left; color:var(--text); font-weight:600; }
  .money-table td:nth-child(2){ text-align:left; color:var(--text-dim); font-weight:400; }
</style>
</head>
<body>
<div class="app">
  <div class="eyebrow" id="dateLabel"></div>
  <div class="title">Time Is Money</div>

  <div class="mode-tabs">
    <button class="mode-tab" id="modeTimeBtn" data-active="true">Time</button>
    <button class="mode-tab" id="modeMoneyBtn" data-active="false">Money</button>
  </div>

  <div id="timeSection">
    <div class="buttons">
      <button class="btn" id="workBtn" data-type="work" data-active="false">▶ App</button>
      <button class="btn" id="productiveBtn" data-type="productive" data-active="false">▶ Productive</button>
      <button class="btn" id="jobBtn" data-type="job" data-active="false">▶ Work</button>
      <button class="btn" id="sleepBtn" data-type="sleep" data-active="false">▶ Sleep</button>
    </div>

    <div class="status-row">
      <div class="status" id="statusLine">Nothing running</div>
      <button class="undo" id="undoBtn" style="display:none;">undo last</button>
    </div>

    <div class="tabs">
      <button class="tab" id="tabToday" data-active="true">Today</button>
      <button class="tab" id="tabHistory" data-active="false">History</button>
    </div>

    <div class="card" id="todayCard">
      <div class="chart-wrap">
        <svg id="pie" viewBox="0 0 200 200" width="220" height="220"></svg>
      </div>
      <div class="legend" id="legend"></div>
    </div>

    <div class="card" id="historyCard" style="display:none;">
      <div id="historyBody"></div>
    </div>
  </div>

  <div id="moneySection" style="display:none;">
    <input type="file" id="scanFileInput" accept="image/*" style="display:none;">

    <div class="buttons" id="moneyButtons"></div>

    <div class="status-row">
      <div class="status" id="moneyTotalLine">₩0 this month</div>
      <div style="display:flex; gap:14px;">
        <button class="undo" id="editCategoriesBtn">edit categories</button>
        <button class="undo" id="undoExpenseBtn" style="display:none;">undo last</button>
      </div>
    </div>

    <div class="card" id="moneyCard"></div>
  </div>

  <div class="footnote" id="footnote"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
(function(){
  // NOTE ON TIME CATEGORY KEYS: the internal key "work" displays as "App" —
  // it's the original tracked category, kept as-is on purpose so every
  // session already logged under it stays intact. "job" and "productive"
  // are newer categories and start at zero.
  var COLORS = {
    work: '#E8794A', job: '#3FBFA8', productive: '#E8C24A', sleep: '#6C6FF0', other: '#3A3F4B',
    fashion: '#5DBB6F', junk: '#E2574C', essentials: '#4EA8E8',
    makeup: '#E85A9E', aesthetics: '#B27BE0', food: '#E2574C'
  };
  var LABELS = {
    work: 'App', job: 'Work', productive: 'Productive', sleep: 'Sleep', other: 'Other',
    fashion: 'Fashion', junk: 'Junk Food', essentials: 'Essentials',
    makeup: 'Beauty', aesthetics: 'Aesthetics', food: 'Food'
  };
  var TYPES = ['work', 'job', 'productive', 'sleep'];

  // ---- money categories are user-editable, stored as {id,label,color} ----
  // ids never change once created (rename only touches the label), so
  // renaming or deleting a category button can never orphan or lose
  // anything already logged under it.
  var DEFAULT_MONEY_CATEGORIES = [
    { id:'fashion', label:'Fashion', color:'#5DBB6F' },
    { id:'makeup', label:'Beauty', color:'#E85A9E' },
    { id:'aesthetics', label:'Aesthetics', color:'#B27BE0' },
    { id:'food', label:'Food', color:'#E2574C' },
    { id:'essentials', label:'Essentials', color:'#4EA8E8' }
  ];
  var COLOR_PALETTE = ['#5DBB6F','#E85A9E','#B27BE0','#E2574C','#4EA8E8','#E8C24A','#3FBFA8','#E8794A','#8B7BE8','#5AA8A0'];

  function loadMoneyCategories(){
    try{
      var raw = localStorage.getItem('dtk_money_categories');
      if(raw){
        var arr = JSON.parse(raw);
        if(Array.isArray(arr) && arr.length) return arr;
      }
    }catch(e){}
    return DEFAULT_MONEY_CATEGORIES.slice();
  }
  function saveMoneyCategories(arr){
    try{ localStorage.setItem('dtk_money_categories', JSON.stringify(arr)); }catch(e){}
  }
  function slugify(label, existingIds){
    var base = label.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'');
    if(!base) base = 'cat';
    var id = base, n = 2;
    while(existingIds.indexOf(id) !== -1){ id = base + '_' + n; n++; }
    return id;
  }
  function nextColor(existing){
    var used = existing.map(function(c){ return c.color; });
    for(var i=0;i<COLOR_PALETTE.length;i++){
      if(used.indexOf(COLOR_PALETTE[i]) === -1) return COLOR_PALETTE[i];
    }
    return COLOR_PALETTE[existing.length % COLOR_PALETTE.length];
  }
  function syncMoneyCategoryLookups(){
    moneyCategories.forEach(function(c){ COLORS[c.id] = c.color; LABELS[c.id] = c.label; });
  }

  function loadActive(){
    try{
      var raw = localStorage.getItem('dtk_active');
      return raw ? JSON.parse(raw) : null;
    }catch(e){ return null; }
  }
  function saveActive(a){
    try{
      if(a) localStorage.setItem('dtk_active', JSON.stringify(a));
      else localStorage.removeItem('dtk_active');
    }catch(e){}
  }
  function loadSessions(){
    try{
      var raw = localStorage.getItem('dtk_sessions');
      var arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr : [];
    }catch(e){ return []; }
  }
  function saveSessions(arr){
    try{ localStorage.setItem('dtk_sessions', JSON.stringify(arr)); }catch(e){}
  }
  function loadExpenses(){
    try{
      var raw = localStorage.getItem('dtk_expenses');
      var arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr : [];
    }catch(e){ return []; }
  }
  function saveExpenses(arr){
    try{ localStorage.setItem('dtk_expenses', JSON.stringify(arr)); }catch(e){}
  }

  var sessions = loadSessions();
  var active = loadActive();
  var expenses = loadExpenses();
  var moneyCategories = loadMoneyCategories();
  var editingMoney = false;
  var pendingCategoryForScan = null;
  syncMoneyCategoryLookups();
  var mode = 'time';
  var currentView = 'today';
  var viewMonth = null;
  var viewMonthMoney = null;
  var historyDirty = true;

  function startOfToday(){
    var d = new Date();
    d.setHours(0,0,0,0);
    return d.getTime();
  }
  function endOfToday(){ return startOfToday() + 24*3600*1000; }

  function overlapMs(startIso, endIso, boundStart, boundEnd){
    var s = Math.max(new Date(startIso).getTime(), boundStart);
    var e = Math.min(new Date(endIso).getTime(), boundEnd);
    return Math.max(0, e - s);
  }

  function formatHM(ms){
    var totalMin = Math.max(0, Math.round(ms/60000));
    var h = Math.floor(totalMin/60);
    var m = totalMin % 60;
    return h + 'h ' + m + 'm';
  }
  function formatClock(ms){
    var totalSec = Math.max(0, Math.floor(ms/1000));
    var h = Math.floor(totalSec/3600);
    var m = Math.floor((totalSec%3600)/60);
    var s = totalSec % 60;
    function pad(v){ return String(v).padStart(2,'0'); }
    return pad(h) + ':' + pad(m) + ':' + pad(s);
  }
  function formatWon(n){
    return '\u20A9' + Math.round(n).toLocaleString('en-US');
  }

  function computeTodayTotals(){
    var boundStart = startOfToday();
    var boundEnd = endOfToday();
    var totals = { work:0, job:0, productive:0, sleep:0 };
    sessions.forEach(function(s){
      var ms = overlapMs(s.start, s.end, boundStart, boundEnd);
      if(totals[s.type] !== undefined) totals[s.type] += ms;
    });
    if(active){
      var ms2 = overlapMs(active.start, new Date().toISOString(), boundStart, boundEnd);
      if(totals[active.type] !== undefined) totals[active.type] += ms2;
    }
    var DAY_MS = boundEnd - boundStart;
    var used = totals.work + totals.job + totals.productive + totals.sleep;
    totals.other = Math.max(0, DAY_MS - used);
    return totals;
  }

  // ---- time history: groups every past session into calendar days,
  // splitting any session that crosses midnight across both days it touches ----
  function dateKeyForTime(ms){
    var d = new Date(ms);
    d.setHours(0,0,0,0);
    var y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
    return y + '-' + m + '-' + day;
  }
  function dayBoundsForKey(key){
    var p = key.split('-').map(Number);
    var start = new Date(p[0], p[1]-1, p[2], 0,0,0,0).getTime();
    return [start, start + 24*3600*1000];
  }
  function formatDateKey(key){
    var p = key.split('-').map(Number);
    var d = new Date(p[0], p[1]-1, p[2]);
    return d.toLocaleDateString(undefined, { month:'short', day:'numeric' });
  }

  function computeHistory(){
    var byDay = {};
    function addChunk(type, s, e){
      var cursor = s, guard = 0;
      while(cursor < e && guard < 60){
        guard++;
        var key = dateKeyForTime(cursor);
        var bounds = dayBoundsForKey(key);
        var chunkEnd = Math.min(e, bounds[1]);
        var dur = chunkEnd - cursor;
        if(!byDay[key]) byDay[key] = { work:0, job:0, productive:0, sleep:0 };
        if(byDay[key][type] !== undefined) byDay[key][type] += dur;
        cursor = chunkEnd;
      }
    }
    sessions.forEach(function(s){
      addChunk(s.type, new Date(s.start).getTime(), new Date(s.end).getTime());
    });
    var todayKeyStr = dateKeyForTime(Date.now());
    return Object.keys(byDay)
      .filter(function(k){ return k !== todayKeyStr; })
      .sort().reverse()
      .map(function(k){
        var d = byDay[k];
        var used = d.work + d.job + d.productive + d.sleep;
        var o = Math.max(0, 24*3600*1000 - used);
        return { key:k, work:d.work, job:d.job, productive:d.productive, sleep:d.sleep, other:o };
      });
  }

  function monthKeyOf(dayKey){ return dayKey.slice(0,7); }
  function monthKeyForIso(iso){
    var d = new Date(iso);
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
  }
  function formatMonthKey(mKey){
    var p = mKey.split('-').map(Number);
    return new Date(p[0], p[1]-1, 1).toLocaleDateString(undefined, { month:'long', year:'numeric' });
  }
  function shiftMonth(mKey, delta){
    var p = mKey.split('-').map(Number);
    var d = new Date(p[0], p[1]-1 + delta, 1);
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
  }
  function currentMonthKey(){
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
  }

  // ---- money: every logged expense grouped into the month it fell in.
  // Order is built from current categories, plus any older category id
  // still found in that month's data (so deleting a button never hides
  // history for months where it was actually used). ----
  function computeMoneyMonth(mKey){
    var rows = [];
    expenses.forEach(function(e){
      if(monthKeyForIso(e.date) === mKey) rows.push(e);
    });
    rows.sort(function(a,b){ return new Date(b.date) - new Date(a.date); });

    var order = moneyCategories.map(function(c){ return c.id; });
    rows.forEach(function(e){
      if(order.indexOf(e.category) === -1){
        order.push(e.category);
        if(!LABELS[e.category]) LABELS[e.category] = e.category;
        if(!COLORS[e.category]) COLORS[e.category] = '#5A5F6B';
      }
    });

    var vals = {};
    order.forEach(function(id){ vals[id] = 0; });
    rows.forEach(function(e){ if(vals[e.category] !== undefined) vals[e.category] += e.amount; });

    return { vals: vals, rows: rows, order: order };
  }

  function polarToCartesian(cx, cy, r, angleDeg){
    var rad = (angleDeg - 90) * Math.PI / 180;
    return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
  }
  function donutPath(cx, cy, rOuter, rInner, startAngle, endAngle){
    if(endAngle - startAngle >= 359.99) endAngle = startAngle + 359.99;
    var so = polarToCartesian(cx, cy, rOuter, endAngle);
    var eo = polarToCartesian(cx, cy, rOuter, startAngle);
    var si = polarToCartesian(cx, cy, rInner, endAngle);
    var ei = polarToCartesian(cx, cy, rInner, startAngle);
    var largeArc = (endAngle - startAngle) <= 180 ? 0 : 1;
    return [
      'M', so.x, so.y,
      'A', rOuter, rOuter, 0, largeArc, 0, eo.x, eo.y,
      'L', ei.x, ei.y,
      'A', rInner, rInner, 0, largeArc, 1, si.x, si.y,
      'Z'
    ].join(' ');
  }

  function buildDonut(vals, order){
    var totalMs = 0;
    order.forEach(function(k){ totalMs += vals[k]; });
    var paths = '';
    var angle = 0;
    var gap = 2;
    order.forEach(function(key){
      var v = vals[key];
      if(v <= 0 || totalMs <= 0) return;
      var sweep = (v / totalMs) * 360;
      var start = angle + gap/2;
      var end = angle + sweep - gap/2;
      if(end > start){
        paths += '<path d="' + donutPath(100,100,85,55,start,end) + '" fill="' + COLORS[key] + '"></path>';
      }
      angle += sweep;
    });
    return paths;
  }

  function buildLegend(vals, order, formatter){
    var fmt = formatter || formatHM;
    return order.map(function(key){
      return '<div class="legend-item">' +
        '<div class="legend-dot-row"><span class="dot" style="background:' + COLORS[key] + '"></span>' +
        '<span class="legend-label">' + LABELS[key] + '</span></div>' +
        '<div class="legend-value">' + fmt(vals[key]) + '</div>' +
        '</div>';
    }).join('');
  }

  var statusLine = document.getElementById('statusLine');
  var undoBtn = document.getElementById('undoBtn');
  var pieSvg = document.getElementById('pie');
  var legend = document.getElementById('legend');
  var dateLabel = document.getElementById('dateLabel');
  var tabToday = document.getElementById('tabToday');
  var tabHistory = document.getElementById('tabHistory');
  var todayCard = document.getElementById('todayCard');
  var historyCard = document.getElementById('historyCard');
  var historyBody = document.getElementById('historyBody');
  var modeTimeBtn = document.getElementById('modeTimeBtn');
  var modeMoneyBtn = document.getElementById('modeMoneyBtn');
  var timeSection = document.getElementById('timeSection');
  var moneySection = document.getElementById('moneySection');
  var moneyTotalLine = document.getElementById('moneyTotalLine');
  var undoExpenseBtn = document.getElementById('undoExpenseBtn');
  var moneyCard = document.getElementById('moneyCard');
  var moneyButtonsEl = document.getElementById('moneyButtons');
  var editCategoriesBtn = document.getElementById('editCategoriesBtn');
  var scanFileInput = document.getElementById('scanFileInput');
  var footnote = document.getElementById('footnote');

  var BUTTONS = TYPES.map(function(type){
    return { type: type, el: document.getElementById(type === 'work' ? 'workBtn' : type + 'Btn') };
  });

  dateLabel.textContent = new Date().toLocaleDateString(undefined, { weekday:'long', month:'long', day:'numeric' });

  function renderHistory(){
    var rows = computeHistory();
    if(rows.length === 0){
      historyBody.innerHTML = '<div class="history-empty">No past days yet. Come back tomorrow.</div>';
      return;
    }

    var monthRows = rows.filter(function(r){ return monthKeyOf(r.key) === viewMonth; });

    var mVals = { work:0, job:0, productive:0, sleep:0 };
    monthRows.forEach(function(r){
      mVals.work += r.work; mVals.job += r.job; mVals.productive += r.productive; mVals.sleep += r.sleep;
    });
    var used = mVals.work + mVals.job + mVals.productive + mVals.sleep;
    mVals.other = Math.max(0, monthRows.length * 24*3600*1000 - used);

    var order = ['work','job','productive','sleep','other'];

    var nav = '<div class="month-nav">' +
      '<button class="month-arrow" id="prevMonth">\u2039</button>' +
      '<div class="month-label">' + formatMonthKey(viewMonth) + '</div>' +
      '<button class="month-arrow" id="nextMonth">\u203A</button>' +
      '</div>';

    if(monthRows.length === 0){
      historyBody.innerHTML = nav + '<div class="history-empty">Nothing logged this month.</div>';
      wireMonthNav();
      return;
    }

    var chart = '<div class="chart-wrap"><svg viewBox="0 0 200 200" width="200" height="200">' + buildDonut(mVals, order) + '</svg></div>';
    var legendHtml = '<div class="legend">' + buildLegend(mVals, order) + '</div>';
    var dayCount = '<div class="month-sub">' + monthRows.length + (monthRows.length === 1 ? ' day' : ' days') + ' logged</div>';

    var body = monthRows.map(function(r){
      return '<tr><td>' + formatDateKey(r.key) + '</td>' +
        '<td>' + formatHM(r.work) + '</td>' +
        '<td>' + formatHM(r.job) + '</td>' +
        '<td>' + formatHM(r.productive) + '</td>' +
        '<td>' + formatHM(r.sleep) + '</td></tr>';
    }).join('');
    var table = '<table class="history-table"><thead><tr><th>Date</th><th>App</th><th>Work</th><th>Prod</th><th>Sleep</th></tr></thead><tbody>' + body + '</tbody></table>';

    historyBody.innerHTML = nav + chart + legendHtml + dayCount + table;
    wireMonthNav();
  }

  function wireMonthNav(){
    var prev = document.getElementById('prevMonth');
    var next = document.getElementById('nextMonth');
    if(prev) prev.addEventListener('click', function(){ viewMonth = shiftMonth(viewMonth, -1); historyDirty = false; renderHistory(); });
    if(next) next.addEventListener('click', function(){ viewMonth = shiftMonth(viewMonth, 1); historyDirty = false; renderHistory(); });
  }

  function render(){
    BUTTONS.forEach(function(b){
      var isActive = !!(active && active.type === b.type);
      b.el.setAttribute('data-active', String(isActive));
      b.el.textContent = isActive ? '■ Stop' : ('\u25B6 ' + LABELS[b.type]);
    });

    if(active){
      var elapsed = Date.now() - new Date(active.start).getTime();
      statusLine.style.color = COLORS[active.type];
      statusLine.textContent = LABELS[active.type] + ' running \u00B7 ' + formatClock(elapsed);
    } else {
      statusLine.style.color = 'var(--text-faint)';
      statusLine.textContent = 'Nothing running';
    }

    undoBtn.style.display = (sessions.length > 0 || active) ? 'block' : 'none';

    tabToday.setAttribute('data-active', String(currentView === 'today'));
    tabHistory.setAttribute('data-active', String(currentView === 'history'));
    todayCard.style.display = currentView === 'today' ? 'block' : 'none';
    historyCard.style.display = currentView === 'history' ? 'block' : 'none';

    if(currentView === 'history'){
      if(historyDirty){ historyDirty = false; renderHistory(); }
      return;
    }

    var totals = computeTodayTotals();
    var order = ['work','job','productive','sleep','other'];
    pieSvg.innerHTML = buildDonut(totals, order);
    legend.innerHTML = buildLegend(totals, order);
  }

  function toggle(type){
    historyDirty = true;
    var nowIso = new Date().toISOString();
    if(active && active.type === type){
      sessions.push({ type: type, start: active.start, end: nowIso });
      saveSessions(sessions);
      active = null;
      saveActive(null);
    } else if(active){
      sessions.push({ type: active.type, start: active.start, end: nowIso });
      saveSessions(sessions);
      active = { type: type, start: nowIso };
      saveActive(active);
    } else {
      active = { type: type, start: nowIso };
      saveActive(active);
    }
    render();
  }

  function undoLast(){
    historyDirty = true;
    if(active){
      active = null;
      saveActive(null);
    } else if(sessions.length){
      sessions.pop();
      saveSessions(sessions);
    }
    render();
  }

  function renderMoney(){
    var data = computeMoneyMonth(viewMonthMoney);
    var order = data.order;
    var total = order.reduce(function(sum,k){ return sum + data.vals[k]; }, 0);

    moneyTotalLine.textContent = formatWon(total) + ' this month';
    undoExpenseBtn.style.display = expenses.length ? 'block' : 'none';

    var nav = '<div class="month-nav">' +
      '<button class="month-arrow" id="prevMoneyMonth">\u2039</button>' +
      '<div class="month-label">' + formatMonthKey(viewMonthMoney) + '</div>' +
      '<button class="month-arrow" id="nextMoneyMonth">\u203A</button>' +
      '</div>';

    if(data.rows.length === 0){
      moneyCard.innerHTML = nav + '<div class="history-empty">Nothing logged this month.</div>';
      wireMoneyMonthNav();
      return;
    }

    var chart = '<div class="chart-wrap"><svg viewBox="0 0 200 200" width="200" height="200">' + buildDonut(data.vals, order) + '</svg></div>';
    var legendHtml = '<div class="legend">' + buildLegend(data.vals, order, formatWon) + '</div>';

    var body = data.rows.map(function(e){
      var d = new Date(e.date);
      var dateStr = d.toLocaleDateString(undefined, { month:'short', day:'numeric' });
      return '<tr><td>' + dateStr + '</td><td>' + (LABELS[e.category] || e.category) + '</td><td>' + formatWon(e.amount) + '</td></tr>';
    }).join('');
    var table = '<table class="history-table money-table"><thead><tr><th>Date</th><th>Category</th><th>Amount</th></tr></thead><tbody>' + body + '</tbody></table>';

    moneyCard.innerHTML = nav + chart + legendHtml + table;
    wireMoneyMonthNav();
  }

  function wireMoneyMonthNav(){
    var prev = document.getElementById('prevMoneyMonth');
    var next = document.getElementById('nextMoneyMonth');
    if(prev) prev.addEventListener('click', function(){ viewMonthMoney = shiftMonth(viewMonthMoney, -1); renderMoney(); });
    if(next) next.addEventListener('click', function(){ viewMonthMoney = shiftMonth(viewMonthMoney, 1); renderMoney(); });
  }

  // ---- dynamic category buttons: normal mode logs an expense on tap,
  // edit mode renames/deletes on tap and shows an "add category" button ----
  function renderMoneyButtons(){
    var html = moneyCategories.map(function(c, idx){
      var isLastOdd = (idx === moneyCategories.length - 1) && (moneyCategories.length % 2 === 1) && !editingMoney;
      var cls = 'btn' + (isLastOdd ? ' money-btn-wide' : '');
      var prefix = editingMoney ? '\u270E ' : '\u20A9 ';
      return '<button class="' + cls + '" data-cat-id="' + c.id + '">' + prefix + c.label + '</button>';
    }).join('');

    if(editingMoney){
      html += '<button class="btn money-btn-wide btn-dashed" id="addCategoryBtn" style="margin-bottom:0;">+ Add category</button>';
    }

    moneyButtonsEl.innerHTML = html;

    var catButtons = moneyButtonsEl.querySelectorAll('[data-cat-id]');
    for(var i=0;i<catButtons.length;i++){
      (function(btn){
        btn.addEventListener('click', function(){
          var id = btn.getAttribute('data-cat-id');
          if(editingMoney) editCategory(id);
          else onCategoryTap(id);
        });
      })(catButtons[i]);
    }

    if(editingMoney){
      var addBtn = document.getElementById('addCategoryBtn');
      if(addBtn) addBtn.addEventListener('click', addCategory);
    }
  }

  function editCategory(id){
    var cat = moneyCategories.filter(function(c){ return c.id === id; })[0];
    if(!cat) return;
    var input = window.prompt('Rename "' + cat.label + '", or clear the text and confirm to remove this button:', cat.label);
    if(input === null) return;
    var trimmed = input.trim();
    if(trimmed === ''){
      var sure = window.confirm('Remove the "' + cat.label + '" button? Anything already logged under it stays in your history.');
      if(!sure) return;
      moneyCategories = moneyCategories.filter(function(c){ return c.id !== id; });
    } else {
      cat.label = trimmed;
      LABELS[id] = trimmed;
    }
    saveMoneyCategories(moneyCategories);
    renderMoneyButtons();
    renderMoney();
  }

  function addCategory(){
    var input = window.prompt('New category name:');
    if(input === null) return;
    var trimmed = input.trim();
    if(!trimmed){ window.alert('Enter a name first.'); return; }
    var existingIds = moneyCategories.map(function(c){ return c.id; });
    var id = slugify(trimmed, existingIds);
    var color = nextColor(moneyCategories);
    moneyCategories.push({ id: id, label: trimmed, color: color });
    COLORS[id] = color;
    LABELS[id] = trimmed;
    saveMoneyCategories(moneyCategories);
    renderMoneyButtons();
    renderMoney();
  }

  function onCategoryTap(id){
    var label = LABELS[id] || id;
    var useScan = window.confirm(label + '\n\nTap OK to scan a screenshot for the amount, or Cancel to type it.');
    if(useScan){
      pendingCategoryForScan = id;
      scanFileInput.click();
    } else {
      finalizeExpense(id, null);
    }
  }

  function logExpense(category){
    finalizeExpense(category, null);
  }

  function finalizeExpense(category, prefillAmount){
    var label = LABELS[category] || category;
    var hasPrefill = prefillAmount !== null && prefillAmount !== undefined;
    var promptLabel = hasPrefill
      ? label + ' \u2014 confirm the amount from your screenshot (\u20A9):'
      : label + ' \u2014 amount spent (\u20A9):';
    var defaultVal = hasPrefill ? String(prefillAmount) : '';
    var input = window.prompt(promptLabel, defaultVal);
    if(input === null) return;
    var cleaned = String(input).replace(/[^0-9.]/g, '');
    var n = parseFloat(cleaned);
    if(!cleaned || isNaN(n) || n <= 0){
      window.alert('Enter a number greater than 0.');
      return;
    }
    expenses.push({ category: category, amount: Math.round(n), date: new Date().toISOString() });
    saveExpenses(expenses);
    renderMoney();
  }

  function undoLastExpense(){
    if(expenses.length){
      expenses.pop();
      saveExpenses(expenses);
      renderMoney();
    }
  }

  // ---- receipt scan: OCR reads the image, finds the largest plausible
  // number, then drops straight into the same confirm prompt as manual
  // entry, for the category that was tapped to start the scan. The photo
  // itself is never saved anywhere, only the confirmed number is. ----
  function extractLikelyAmount(text){
    var matches = String(text).match(/[0-9][0-9,]*(\.[0-9]+)?/g);
    if(!matches) return null;
    var nums = matches
      .map(function(m){ return parseFloat(m.replace(/,/g, '')); })
      .filter(function(n){ return !isNaN(n) && n > 0; });
    if(!nums.length) return null;
    return Math.round(Math.max.apply(null, nums));
  }

  function runOcr(file){
    var category = pendingCategoryForScan;
    pendingCategoryForScan = null;
    moneyTotalLine.textContent = 'Reading image\u2026';
    if(typeof Tesseract === 'undefined'){
      window.alert("The scanner didn't load, check your connection. You can type the amount instead.");
      renderMoney();
      finalizeExpense(category, null);
      return;
    }
    return Tesseract.createWorker('eng').then(function(worker){
      return worker.recognize(file).then(function(result){
        return worker.terminate().then(function(){ return result; });
      });
    }).then(function(result){
      var text = (result && result.data && result.data.text) || '';
      var amount = extractLikelyAmount(text);
      renderMoney();
      if(amount === null) window.alert("Couldn't find a clear amount in that image. Type it instead.");
      finalizeExpense(category, amount);
    }).catch(function(){
      renderMoney();
      window.alert('Something went wrong reading that image. Type the amount instead.');
      finalizeExpense(category, null);
    });
  }

  function setMode(m){
    mode = m;
    modeTimeBtn.setAttribute('data-active', String(mode === 'time'));
    modeMoneyBtn.setAttribute('data-active', String(mode === 'money'));
    timeSection.style.display = mode === 'time' ? 'block' : 'none';
    moneySection.style.display = mode === 'money' ? 'block' : 'none';
    footnote.textContent = mode === 'time'
      ? "Resets at midnight. \"Other\" is whatever's left of the 24 hours."
      : 'Just logs what you tap in. Nothing here is automatic.';
    if(mode === 'time') render();
    else { renderMoneyButtons(); renderMoney(); }
  }

  BUTTONS.forEach(function(b){ b.el.addEventListener('click', function(){ toggle(b.type); }); });
  undoBtn.addEventListener('click', undoLast);
  tabToday.addEventListener('click', function(){ currentView = 'today'; render(); });
  tabHistory.addEventListener('click', function(){ currentView = 'history'; historyDirty = true; render(); });

  renderMoneyButtons();
  undoExpenseBtn.addEventListener('click', undoLastExpense);
  editCategoriesBtn.addEventListener('click', function(){
    editingMoney = !editingMoney;
    editCategoriesBtn.textContent = editingMoney ? 'done' : 'edit categories';
    renderMoneyButtons();
  });
  scanFileInput.addEventListener('change', function(e){
    var file = e.target.files && e.target.files[0];
    scanFileInput.value = '';
    if(file) runOcr(file);
  });

  modeTimeBtn.addEventListener('click', function(){ setMode('time'); });
  modeMoneyBtn.addEventListener('click', function(){ setMode('money'); });

  viewMonth = currentMonthKey();
  viewMonthMoney = currentMonthKey();

  setInterval(function(){ if(mode === 'time') render(); }, 1000);
  setMode('time');
})();
</script>
</body>
</html>
