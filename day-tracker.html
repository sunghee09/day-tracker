<title>Day Tracker</title>
<style>
  :root{
    --bg:#16181D;
    --card:#1E212A;
    --border:#2A2E38;
    --text:#EDEEF2;
    --text-dim:#8B909C;
    --text-faint:#54586A;
    --work:#E8794A;
    --sleep:#6C6FF0;
    --other:#3A3F4B;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;
    justify-content:center;
    padding:calc(env(safe-area-inset-top,20px) + 20px) 20px calc(env(safe-area-inset-bottom,20px) + 24px);
    min-height:100%;
  }
  .app{ width:100%; max-width:440px; }
  .eyebrow{ font-size:13px; color:var(--text-dim); letter-spacing:0.3px; }
  .title{ font-size:22px; font-weight:700; margin-top:2px; margin-bottom:22px; }
  .buttons{ display:flex; gap:12px; margin-bottom:14px; }
  .btn{
    flex:1;
    padding:22px 16px;
    border-radius:14px;
    border:1px solid var(--border);
    background:var(--card);
    color:var(--text);
    font-family:inherit;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:background .15s ease, border-color .15s ease, color .15s ease;
    -webkit-appearance:none;
    appearance:none;
  }
  .btn[data-active="true"][data-type="work"]{ background:var(--work); border-color:var(--work); color:#0F1013; animation:pulse 2s ease-in-out infinite; }
  .btn[data-active="true"][data-type="sleep"]{ background:var(--sleep); border-color:var(--sleep); color:#0F1013; animation:pulse 2s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:0.82; } }
  .status-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:24px;
    min-height:20px;
  }
  .status{
    font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
    font-size:14px;
    color:var(--text-faint);
  }
  .undo{
    background:none;
    border:none;
    color:var(--text-dim);
    font-size:12px;
    text-decoration:underline;
    padding:0;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:20px 16px 8px;
  }
  .chart-wrap{ display:flex; justify-content:center; }
  .legend{ display:flex; justify-content:space-around; padding:12px 0 18px; }
  .legend-item{ text-align:center; }
  .legend-dot-row{ display:flex; align-items:center; gap:6px; justify-content:center; }
  .dot{ width:8px; height:8px; border-radius:50%; }
  .legend-label{ font-size:12px; color:var(--text-dim); }
  .legend-value{ font-size:15px; font-weight:600; margin-top:4px; }
  .footnote{ font-size:11px; color:var(--text-faint); margin-top:16px; text-align:center; }
</style>
</head>
<body>
<div class="app">
  <div class="eyebrow" id="dateLabel"></div>
  <div class="title">Day tracker</div>

  <div class="buttons">
    <button class="btn" id="workBtn" data-type="work" data-active="false">▶ Work</button>
    <button class="btn" id="sleepBtn" data-type="sleep" data-active="false">▶ Sleep</button>
  </div>

  <div class="status-row">
    <div class="status" id="statusLine">Nothing running</div>
    <button class="undo" id="undoBtn" style="display:none;">undo last</button>
  </div>

  <div class="card">
    <div class="chart-wrap">
      <svg id="pie" viewBox="0 0 200 200" width="220" height="220"></svg>
    </div>
    <div class="legend" id="legend"></div>
  </div>

  <div class="footnote">Resets at midnight. "Other" is whatever's left of the 24 hours.</div>
</div>

<script>
(function(){
  var COLORS = { work: '#E8794A', sleep: '#6C6FF0', other: '#3A3F4B' };
  var LABELS = { work: 'Work', sleep: 'Sleep', other: 'Other' };

  function loadActive(){
    try{
      var raw = localStorage.getItem('dtk_active');
      return raw ? JSON.parse(raw) : null;
    }catch(e){ return null; }
  }
  function saveActive(a){
    try{
      if(a) localStorage.setItem('dtk_active', JSON.stringify(a));
      else localStorage.removeItem('dtk_active');
    }catch(e){}
  }
  function loadSessions(){
    try{
      var raw = localStorage.getItem('dtk_sessions');
      var arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr : [];
    }catch(e){ return []; }
  }
  function saveSessions(arr){
    try{ localStorage.setItem('dtk_sessions', JSON.stringify(arr)); }catch(e){}
  }

  var sessions = loadSessions();
  var active = loadActive();

  function startOfToday(){
    var d = new Date();
    d.setHours(0,0,0,0);
    return d.getTime();
  }
  function endOfToday(){ return startOfToday() + 24*3600*1000; }

  function overlapMs(startIso, endIso, boundStart, boundEnd){
    var s = Math.max(new Date(startIso).getTime(), boundStart);
    var e = Math.min(new Date(endIso).getTime(), boundEnd);
    return Math.max(0, e - s);
  }

  function formatHM(ms){
    var totalMin = Math.max(0, Math.round(ms/60000));
    var h = Math.floor(totalMin/60);
    var m = totalMin % 60;
    return h + 'h ' + m + 'm';
  }
  function formatClock(ms){
    var totalSec = Math.max(0, Math.floor(ms/1000));
    var h = Math.floor(totalSec/3600);
    var m = Math.floor((totalSec%3600)/60);
    var s = totalSec % 60;
    function pad(v){ return String(v).padStart(2,'0'); }
    return pad(h) + ':' + pad(m) + ':' + pad(s);
  }

  function computeTodayTotals(){
    var boundStart = startOfToday();
    var boundEnd = endOfToday();
    var work = 0, sleep = 0;
    sessions.forEach(function(s){
      var ms = overlapMs(s.start, s.end, boundStart, boundEnd);
      if(s.type === 'work') work += ms;
      else if(s.type === 'sleep') sleep += ms;
    });
    if(active){
      var ms2 = overlapMs(active.start, new Date().toISOString(), boundStart, boundEnd);
      if(active.type === 'work') work += ms2;
      else if(active.type === 'sleep') sleep += ms2;
    }
    var DAY_MS = boundEnd - boundStart;
    var other = Math.max(0, DAY_MS - work - sleep);
    return { work: work, sleep: sleep, other: other };
  }

  function polarToCartesian(cx, cy, r, angleDeg){
    var rad = (angleDeg - 90) * Math.PI / 180;
    return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
  }
  function donutPath(cx, cy, rOuter, rInner, startAngle, endAngle){
    if(endAngle - startAngle >= 359.99) endAngle = startAngle + 359.99;
    var so = polarToCartesian(cx, cy, rOuter, endAngle);
    var eo = polarToCartesian(cx, cy, rOuter, startAngle);
    var si = polarToCartesian(cx, cy, rInner, endAngle);
    var ei = polarToCartesian(cx, cy, rInner, startAngle);
    var largeArc = (endAngle - startAngle) <= 180 ? 0 : 1;
    return [
      'M', so.x, so.y,
      'A', rOuter, rOuter, 0, largeArc, 0, eo.x, eo.y,
      'L', ei.x, ei.y,
      'A', rInner, rInner, 0, largeArc, 1, si.x, si.y,
      'Z'
    ].join(' ');
  }

  var workBtn = document.getElementById('workBtn');
  var sleepBtn = document.getElementById('sleepBtn');
  var statusLine = document.getElementById('statusLine');
  var undoBtn = document.getElementById('undoBtn');
  var pieSvg = document.getElementById('pie');
  var legend = document.getElementById('legend');
  var dateLabel = document.getElementById('dateLabel');

  dateLabel.textContent = new Date().toLocaleDateString(undefined, { weekday:'long', month:'long', day:'numeric' });

  function render(){
    workBtn.setAttribute('data-active', String(!!(active && active.type === 'work')));
    sleepBtn.setAttribute('data-active', String(!!(active && active.type === 'sleep')));
    workBtn.textContent = (active && active.type === 'work') ? '■ Stop' : '▶ Work';
    sleepBtn.textContent = (active && active.type === 'sleep') ? '■ Stop' : '▶ Sleep';

    if(active){
      var elapsed = Date.now() - new Date(active.start).getTime();
      statusLine.style.color = COLORS[active.type];
      statusLine.textContent = LABELS[active.type] + ' running \u00B7 ' + formatClock(elapsed);
    } else {
      statusLine.style.color = 'var(--text-faint)';
      statusLine.textContent = 'Nothing running';
    }

    undoBtn.style.display = (sessions.length > 0 || active) ? 'block' : 'none';

    var totals = computeTodayTotals();
    var order = ['work','sleep','other'];
    var vals = { work: totals.work, sleep: totals.sleep, other: totals.other };
    var totalMs = totals.work + totals.sleep + totals.other;

    var paths = '';
    var angle = 0;
    var gap = 2;
    order.forEach(function(key){
      var v = vals[key];
      if(v <= 0 || totalMs <= 0) return;
      var sweep = (v / totalMs) * 360;
      var start = angle + gap/2;
      var end = angle + sweep - gap/2;
      if(end > start){
        paths += '<path d="' + donutPath(100,100,85,55,start,end) + '" fill="' + COLORS[key] + '"></path>';
      }
      angle += sweep;
    });
    pieSvg.innerHTML = paths;

    legend.innerHTML = order.map(function(key){
      return '<div class="legend-item">' +
        '<div class="legend-dot-row"><span class="dot" style="background:' + COLORS[key] + '"></span>' +
        '<span class="legend-label">' + LABELS[key] + '</span></div>' +
        '<div class="legend-value">' + formatHM(vals[key]) + '</div>' +
        '</div>';
    }).join('');
  }

  function toggle(type){
    var nowIso = new Date().toISOString();
    if(active && active.type === type){
      sessions.push({ type: type, start: active.start, end: nowIso });
      saveSessions(sessions);
      active = null;
      saveActive(null);
    } else if(active){
      sessions.push({ type: active.type, start: active.start, end: nowIso });
      saveSessions(sessions);
      active = { type: type, start: nowIso };
      saveActive(active);
    } else {
      active = { type: type, start: nowIso };
      saveActive(active);
    }
    render();
  }

  function undoLast(){
    if(active){
      active = null;
      saveActive(null);
    } else if(sessions.length){
      sessions.pop();
      saveSessions(sessions);
    }
    render();
  }

  workBtn.addEventListener('click', function(){ toggle('work'); });
  sleepBtn.addEventListener('click', function(){ toggle('sleep'); });
  undoBtn.addEventListener('click', undoLast);

  setInterval(function(){ render(); }, 1000);
  render();
})();
</script>
</body>
</html>
